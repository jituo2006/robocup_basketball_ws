<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>场地坐标编辑器 · RoboCup 篮球</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: #f4f4f2; color: #1e1e1e; display: flex; overflow: hidden;
  }
  /* ── 左：画布 ───────────────────────────────────────── */
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #topbar {
    display: flex; align-items: center; gap: 14px; padding: 8px 14px;
    background: #fff; border-bottom: 1px solid #dcdcd8; flex-wrap: wrap;
  }
  #topbar h1 { font-size: 15px; margin: 0 10px 0 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    padding: 5px 13px; border: 1px solid #cfcfca; background: #fafaf8;
    border-radius: 5px; cursor: pointer; font-size: 13px; color: #444;
  }
  .tabs button.on { background: #2f6fd0; border-color: #2f6fd0; color: #fff; font-weight: 600; }
  .tabs button:hover:not(.on) { background: #f0f0ec; }
  /* 加点 / 连线 / 删点 这几个操作按钮 */
  #topbar button.tb {
    padding: 4px 10px; border: 1px solid #cfcfca; background: #fff;
    border-radius: 5px; cursor: pointer; font-size: 12px; color: #333;
  }
  #topbar button.tb:hover { background: #f4f4f0; }
  #topbar button.tb.on {
    background: #e08a1e; border-color: #e08a1e; color: #fff; font-weight: 600;
  }
  /* 选中的点加一圈强调环 */
  .hnd.sel circle.vis { stroke-width: 4; }
  .sep { width: 1px; height: 22px; background: #dcdcd8; }
  label.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  #wrap { flex: 1; overflow: auto; padding: 10px 14px 20px; }
  svg { background: #fff; border-radius: 6px; display: block; }
  .hint { color: #8a8a84; font-size: 12px; margin: 6px 0 0; }

  /* ── 右：面板 ───────────────────────────────────────── */
  #panel {
    width: 400px; background: #fff; border-left: 1px solid #dcdcd8;
    display: flex; flex-direction: column; min-width: 0;
  }
  #panel .head { padding: 10px 14px 8px; border-bottom: 1px solid #ececea; }
  #panel .head h2 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  #panel .head p { margin: 0; color: #8a8a84; font-size: 12px; }
  #body { flex: 1; overflow: auto; padding: 8px 0 60px; }
  .grp { margin: 0 0 4px; }
  .grp > h3 {
    margin: 0; padding: 9px 14px 5px; font-size: 12px; font-weight: 600;
    color: #6b6b66; letter-spacing: .02em;
  }
  .grp > h3 small { font-weight: 400; color: #9d9d97; margin-left: 6px; }
  .row {
    display: grid; grid-template-columns: 1fr 78px 78px; gap: 6px;
    align-items: center; padding: 2px 14px;
  }
  .row:hover { background: #f7f7f4; }
  .row .k { font-size: 12px; color: #333; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
  .row .k i { display: inline-block; width: 8px; height: 8px; border-radius: 2px;
              margin-right: 6px; vertical-align: middle; }
  .row input {
    width: 100%; padding: 3px 4px; border: 1px solid #d8d8d3; border-radius: 4px;
    font: 11px/1.4 ui-monospace, Consolas, monospace; text-align: right; background: #fff;
  }
  .row input:focus { outline: 2px solid #bcd4f5; border-color: #7aa9e6; }
  .row input.ro { background: #f4f4f1; color: #777; }
  .row.head2 { grid-template-columns: 1fr 78px 78px; color: #9d9d97; font-size: 11px;
               padding-bottom: 0; }
  .row.head2 span:nth-child(2), .row.head2 span:nth-child(3) { text-align: right; }

  #foot { border-top: 1px solid #ececea; padding: 8px 14px; display: flex; gap: 6px;
          flex-wrap: wrap; background: #fcfcfa; position: relative; }
  #foot button {
    padding: 6px 11px; border: 1px solid #cfcfca; background: #fff; border-radius: 5px;
    cursor: pointer; font-size: 12px;
  }
  #foot button.pri { background: #2f6fd0; border-color: #2f6fd0; color: #fff; font-weight: 600; }
  #foot button:hover { filter: brightness(.96); }
  /* 导出下拉 */
  .dd { position: relative; }
  .ddmenu {
    position: absolute; bottom: 34px; left: 0; min-width: 230px; z-index: 40;
    background: #fff; border: 1px solid #cfcfca; border-radius: 7px; padding: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14); display: none;
  }
  .ddmenu.open { display: block; }
  .ddmenu button {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    padding: 7px 9px; font-size: 12px; border-radius: 5px; cursor: pointer;
  }
  .ddmenu button:hover { background: #f2f2ee; }
  .ddmenu button .t { display: block; color: #333; }
  .ddmenu button .d { display: block; color: #9d9d97; font-size: 11px; margin-top: 1px; }
  .ddmenu hr { border: 0; border-top: 1px solid #ececea; margin: 4px 2px; }
  #ddBadge { font-weight: 700; }
  #ddBadge.some { color: #d97706; }
  #saveInfo {
    padding: 5px 14px 9px; font-size: 11.5px; color: #8a8a84;
    border-top: 1px solid #f2f2ee; background: #fcfcfa; line-height: 1.6;
  }
  #saveInfo b { color: #444; }
  #saveInfo .chg { color: #d97706; font-weight: 600; }
  #saveInfo .ok { color: #1f9152; }

  /* ── 走法顺序编辑器（右面板顶部）────────────────────────── */
  #rte { border-bottom: 2px solid #e4e4df; background: #fbfbf9; }
  #rte .rh { display: flex; align-items: center; gap: 6px; padding: 9px 12px 5px; }
  #rte .rh b { font-size: 12px; flex: 1; }
  #rte .rh button {
    padding: 3px 8px; border: 1px solid #cfcfca; background: #fff;
    border-radius: 5px; cursor: pointer; font-size: 11.5px;
  }
  #rte .rh button:hover { background: #f0f0ec; }
  #rte .rl { padding: 0 0 7px; }
  #rte .st {
    display: grid; grid-template-columns: 24px 1fr 74px;
    gap: 3px; align-items: center; padding: 2px 10px 2px 8px;
    font-size: 12px; cursor: pointer; border-left: 3px solid transparent;
  }
  #rte .st:hover { background: #f2f2ee; }
  #rte .st.sel { background: #e8f0fb; border-left-color: #2f6fd0; }
  #rte .st .n { color: #a2a29c; font-size: 11px; text-align: right; }
  #rte .st .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rte .st .nm i { display: inline-block; width: 7px; height: 7px; border-radius: 2px;
                   margin-right: 5px; vertical-align: middle; }
  #rte .st .nm small { color: #a2a29c; }
  #rte .st .ops { text-align: right; white-space: nowrap; }
  #rte .st .ops button {
    border: 0; background: none; cursor: pointer; color: #b0b0aa;
    padding: 1px 3px; font-size: 12px; line-height: 1; border-radius: 3px;
  }
  #rte .st .ops button:hover { color: #2f6fd0; background: #e8f0fb; }
  #rte .st .ops button.del:hover { color: #d63c3c; background: #fdeceb; }
  #rte .st .ops button:disabled { opacity: .25; cursor: default; }
  #rte .st .ops button:disabled:hover { color: #b0b0aa; background: none; }
  #rte .hint2 { padding: 0 12px 7px; font-size: 11px; color: #a2a29c; line-height: 1.6; }
  #rte .hint2 b { color: #6b6b66; }

  dialog {
    border: 1px solid #cfcfca; border-radius: 8px; padding: 0; width: min(760px, 92vw);
    max-height: 84vh;
  }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog .dh { display: flex; align-items: center; padding: 10px 14px;
               border-bottom: 1px solid #ececea; gap: 8px; }
  dialog .dh strong { flex: 1; font-size: 13px; }
  dialog .dh button { padding: 4px 10px; border: 1px solid #cfcfca; background: #fff;
                      border-radius: 5px; cursor: pointer; font-size: 12px; }
  dialog textarea {
    width: 100%; height: 56vh; border: 0; border-top: 1px solid #ececea; padding: 12px 14px;
    font: 12px/1.55 ui-monospace, Consolas, monospace; resize: none; outline: none;
    background: #fbfbf9;
  }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #eef4fc;
          color: #2f6fd0; }
  .pill.warn { background: #fdf3e6; color: #b4720f; }

  /* SVG 交互 */
  .hnd { cursor: grab; }
  .hnd:active { cursor: grabbing; }
  .hnd circle.hit { fill: transparent; }
  .hnd:hover circle.vis { r: 9; }
  .lbl { font: 11px "Microsoft YaHei", sans-serif; paint-order: stroke;
         stroke: #fff; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }

  /* 悬停解释气泡 */
  #tip {
    position: fixed; left: 0; top: 0; max-width: 340px;
    background: #26262a; color: #ededed; padding: 9px 12px;
    border-radius: 6px; font-size: 12px; line-height: 1.65;
    pointer-events: none; opacity: 0; z-index: 60;
    transition: opacity .12s;
  }
  #tip.on { opacity: 1; }
  #tip b { color: #ffd479; display: block; margin-bottom: 3px; font-size: 12.5px; }
  #tip i { color: #9ecbff; font-style: normal; }
</style>
</head>
<body>

<div id="stage">
  <div id="topbar">
    <h1>场地坐标编辑器</h1>
    <div class="tabs" id="taskTabs"></div>
    <div class="sep"></div>
    <div class="tabs" id="startTabs"></div>
  <div class="tabs" id="tabs"></div>
    <div class="sep"></div>
    <label class="chk"><input type="checkbox" id="cbGrid"> 网格</label>
    <label class="chk"><input type="checkbox" id="cbSnap"> 吸附 0.05m</label>
    <label class="chk" title="拖动时锁成纯水平或纯垂直（按住 Shift 也生效）">
      <input type="checkbox" id="cbOrtho"> <b>正交约束</b></label>
    <div class="sep"></div>
    <label class="chk"><input type="checkbox" id="cbRoute" checked> 连线</label>
    <label class="chk"><input type="checkbox" id="cbArrows" checked> 箭头</label>
    <label class="chk"><input type="checkbox" id="cbSteps" checked> 步号</label>
    <label class="chk"><input type="checkbox" id="ly_wp" checked> 途经点</label>
    <div class="sep"></div>
    <button id="btnAdd"  class="tb" onclick="toggleAdd()"  title="开启后在地图上点一下，就在选中点后面插入一个途经点">＋ 加点</button>
    <button id="btnLink" class="tb" onclick="toggleLink()" title="进入连线模式：依次点各个点，重新定义走法顺序">⇢ 连线</button>
    <button id="btnDel"  class="tb" onclick="deleteSel()" title="删除选中的途经点（功能性节点不可删）">✕ 删点</button>
    <div class="sep"></div>
    <label class="chk"><input type="checkbox" id="ly_base" checked> 起步</label>
    <label class="chk"><input type="checkbox" id="ly_middle" checked> 中线</label>
    <label class="chk"><input type="checkbox" id="ly_arc" checked> 弧线</label>
    <label class="chk"><input type="checkbox" id="ly_inner" checked> 深场</label>
    <label class="chk"><input type="checkbox" id="ly_release" checked> 出球点</label>
    <label class="chk"><input type="checkbox" id="ly_mission" checked> 场地几何</label>
    <label class="chk"><input type="checkbox" id="ly_lm" checked> 定位柱</label>
  </div>
  <div id="wrap">
    <svg id="svg"></svg>
    <p class="hint">
      <b>选轮次只显示那一轮的路线。</b>拖任意圆点改坐标，右侧数字框也能输入；
      开「正交约束」后拖动会锁成水平/垂直。
      <span class="pill" id="hintRound"></span>
    </p>
  </div>
</div>

<div id="panel">
  <div class="head">
    <h2 id="ph">数值</h2>
    <p>改动会<b>自动存在浏览器里</b>，刷新不丢。想留成文件就点「💾 保存进度」；
       要覆盖仓库文件才点「导出…」—— 底部会告诉你<b>哪几个文件真的改了</b>。</p>
  </div>
  <div id="rte"></div>
  <div id="body"></div>
  <div id="foot">
    <button id="btnUndo" onclick="undo()" disabled
            title="撤回上一步改动（也可按 Ctrl+Z）">↶ 撤回</button>
    <button class="pri" id="btnSave" onclick="saveState()"
            title="把当前所有坐标存成一个文件，下次用「打开」接着编">💾 保存进度</button>
    <button onclick="document.getElementById('fileIn').click()"
            title="打开之前保存的进度文件">📂 打开</button>
    <input type="file" id="fileIn" accept=".json,application/json"
           style="display:none" onchange="loadState(this)">
    <div class="dd" id="dd">
      <button onclick="toggleDD(event)">导出… <span id="ddBadge"></span></button>
      <div class="ddmenu" id="ddmenu"></div>
    </div>
    <button onclick="resetAll()" title="恢复成仓库原始值（可撤回）">重置</button>
  </div>
  <div id="saveInfo"></div>
</div>

<dialog id="dlg">
  <div class="dh">
    <strong id="dtitle"></strong>
    <button onclick="copyOut()">复制</button>
    <button onclick="dlg.close()">关闭</button>
  </div>
  <textarea id="dout" spellcheck="false"></textarea>
</dialog>

<div id="tip"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════
   初始数据 —— 与仓库当前值一致
   ═══════════════════════════════════════════════════════════════════ */
const DEFAULTS = {
  /* ═══════════════════════════════════════════════════════════════════
     ⚠️ 本块【逐字对齐 jituo2006/robocup_basketball_ws 的 main 分支】
        tools/match_rounds.json      → S.match
        src/rb_mission/config/mission.yaml (field 段)  → S.mission
        src/rb_localization/config/localization.yaml   → S.landmarks（已被队友删除）
     采集时间：jituo/main = 6e04b37

     ⚠️ 坐标系：ROS 侧仍然用【旧帧】——
          x 沿 14m 长边，原点在远离篮筐那条底线；y 沿 7.5m 短边，y=3.75 是宽度中线
        jituo 另有一套【公开帧】给前端/API 用（+Y 朝篮筐，x=0 在宽度中线），
        由 tools/field_coordinates.py 做转换，ROS 内部不变。见 PUBLIC_FRAME_* 常量。
     ═══════════════════════════════════════════════════════════════════ */

  /* tools/match_rounds.json */
  match: {
    start: [1.5, 8.0],
    entry: [1.5, 6.8],
    corridor: [6.4, 6.05],
    speed_mps: 0.50,
    /* 队友 60fe3ca 新增：按回合分段速度。没有对应回合的键就用 speed_mps。 */
    speed_profiles: {
      "1": { travel_mps: 0.85, carry_mps: 0.65, scan_mps: 0.25,
             pickup_exit_mps: 0.15, turn_rad_s: 1.0,
             approach_radius_m: 0.25, approach_mps: 0.12 },
      "2": { travel_mps: 0.85, carry_mps: 0.65, scan_mps: 0.25,
             pickup_exit_mps: 0.15, turn_rad_s: 1.0,
             approach_radius_m: 0.25, approach_mps: 0.12 },
      "3": { travel_mps: 0.85, carry_mps: 0.65, scan_mps: 0.25,
             pickup_exit_mps: 0.15, turn_rad_s: 1.0,
             approach_radius_m: 0.25, approach_mps: 0.12 }
    },
    start_delay_s: 10.0,
    drop_commands: ["dji_move 1 0 5"],
    /* 中线：左右端点和队友一致；scan_dir 是【我方走线】加的按轮次方向
       第1轮车在右端附近 ⇒ 先到右端再往左扫；第2轮从进场点(左)过来 ⇒ 先到左端。
       穷举过：第2轮 lr 比 rl 省 3.4 m（传球）/ 3.9 m（投篮）。 */
    /* y=4.45 是【旧帧】；导出成新帧就是 0.7（0.7 = 到球线的距离，正好等于 scoop_m），
       面板/悬停里看到的就是 0.7。 */
    middle: { y: 4.65, left_x: 0.6, right_x: 4.4, scoop_m: 0.44,
              scan_dir: { "1": "rl", "2": "lr", "3": "lr" } },
    /* 三分弧。传球走【外侧】R=4.65（扫完往左回传球点）；
       投篮走【内侧】R=2.85（2026 规则允许进三分线取球；内侧离投篮点近得多）。
       ⚠️ 队友原来是 [160,170,180,190,200]：190°/200° 落在【对方半场】且弧线拉得长，
          投篮第3轮会和深场线来回穿插。这里换回精简角度。
       angles_shoot 按轮次给：第2轮弧线在投篮点【之后】⇒ 先扫近端；
                              第3轮弧线在投篮点【之前】⇒ 先扫远端收在近端。 */
    arc: { center: [11.0, 3.75], radius: 4.65,
           angles_deg: [138, 146, 154, 162, 170], scoop_m: 0.44,
           radius_shoot: 2.85,
           angles_shoot: { "2": [110, 124, 138, 152, 165],
                           "3": [165, 152, 138, 124, 110] } },
    /* 深场（三分线内置球区 X=9 那条红线）。
       x=8.3 / x_shoot=9.7 —— 都离球线 X=9.0 正好 0.7 m，和寻中线的距离一致。
       top_y 6.9 = 整车不出上边线的极限（红线本半场到 6.92，原来只扫到 6.2 会漏 0.72 m）。
       bottom_y 4.4 = 整车不出中线的极限（队友的 1.3 在对方半场深处）。
       dir_pass=bt 从下到上（弧线扫完停在低处，接得上、不折返）；
       dir_shoot=tb 从上到下（扫完停在低处，直接进投篮点）。 */
    inner: { x: 8.1, x_shoot: 9.9, top_y: 6.9, bottom_y: 4.4, scoop_m: 0.44,
             dir_pass: "bt", dir_shoot: "tb" },
    release: {
      /* 传球点 = 【传球柱 ↔ 传球区圆心】连线与传球区边界的交点附近
           圆心 (2.5,3.75) R=2.5；传球柱 (5.75,7.5) → 方向 49.1°（不是 45°）
           沿这条线走到"整车刚好还在圆内"：(3.55,4.95)，到柱 3.37 m
           原先 (3.6,4.5) 算下来车最低 y=3.72，本来就压过中线 3 cm。
           朝向 49° 指向 A 方传球目标区3（顶部圆环，单次 50 分）。
           ⚠️ 队友的 first_pass_route.json 用公开帧 (-1.9,3.45) = 旧帧 (3.45,5.675)，
              离柱更近但车会伸出传球圆 0.43 m —— 判罚尺度要靠现场问裁判。 */
      pass:  { aim_mode: "fixed", point: [3.715, 5.138], aim: null,
               commands: ["vesc_stop", "vesc_home", "vesc_shoot 3", "vesc_stop", "vesc_reset"],
               command_waits_s: [1.0, 1.0, 2.0, 0.0, 0.0],
               wait_s: 1.0, search_heading_deg: 49.0 },
      /* 投篮点 = 三分线内、投篮边界线外、离篮筐最近、整车不出我们半场
           到篮筐 2.13 m（>2.0 投篮分 10），到三分圆心 0.97（<3.75 命中分 10）
           队友的 (6.4,4.8) 离篮筐 6.12 m —— 太远。 */
      shoot: { point: [10.195, 4.653], aim: [12.425, 3.75],
               commands: ["vesc_stop", "vesc_home", "vesc_shoot 3", "vesc_stop", "vesc_reset"],
               command_waits_s: [1.0, 1.0, 2.0, 0.0, 0.0], wait_s: 1.0 }
    },
    pillar_alignment: {
      enabled: true, confidence: 0.55, tolerance_deg: 1.5,
      stable_frames: 3, timeout_s: 6.0, max_turn_deg: 20.0,
      max_ang_rad_s: 0.15, kp: 1.2,
      camera_yaw_offset_rad: 0.0, launcher_yaw_offset_deg: 0.0,
      /* 出球只看角度、不看视觉：这里是【需要前摄对柱】的任务名单。
         空列表 = 谁都不对柱（当前）；要传球对柱就填 ["pass"]。 */
      tasks: [] },
    round1_first_ball: "preloaded",

    /* ── A/B 出发点（关于场地宽度中线 y=0 对称）──
       路线只按 A 帧写这一份；B 出发由代码整份镜像生成，不另写一份。
       start_points 是【实际摆放坐标】，set_start_point.sh 用它同步 localization.yaml
       的 start_pose；start 就是 A 的坐标，也是镜像的源。 */
    start_points: { A: [1.5, 4.25], B: [1.5, -4.25] },
    start_point: "A",

}
/* 按【出球点】把 route 切段，每段里的 @区域 就是这一阶段要找的区。
   阶段1 / 阶段2 各一份，不互相覆盖 —— 你画阶段1找中线、阶段2找弧线，
   车就不会两个阶段都把整份列表重搜一遍。 */
function areasByStageOf(r, tk) {
  const stages = [];
  let cur = [];
  const actionToks = ["passPt", "shootPt"];
  for (const t of routeList(tk || task, r)) {
    if (actionToks.includes(t)) { stages.push(cur); cur = []; continue; }
    if (isAreaTok(t)) { const a = t.slice(1); if (!cur.includes(a)) cur.push(a); }
  }
  if (cur.length) stages.push(cur);        // 末尾没跟出球点的段（一般不会有）
  return stages;
}

function activeAreas() {
  if (round === "all") return ["middle", "arc", "inner"];
  return activeAreasOf(round, task);
}
/* 某个图层现在画不画：既要在本轮范围内，也要被用户勾上 */
function visible(k) {
  if (!LAYERS[k]) return false;
  if (k === "base" || k === "release" || k === "mission" || k === "lm" || k === "wp")
    return true;
  return activeAreas().includes(k);
}
/* 某个图层在本轮是否适用（用来禁用无关的勾选框） */
function applies(k) {
  if (k === "base" || k === "release" || k === "mission" || k === "lm" || k === "wp")
    return true;
  return activeAreas().includes(k);
}

/* ── 一个区域按搜索顺序给出它的扫描点 ─────────────────────── */
function areaPoints(area, r, tk) {
  const M = S.match;
  r = (r === undefined) ? round : r;
  tk = tk || task;
  if (area === "middle") {
    const a = [M.middle.right_x, M.middle.y], b = [M.middle.left_x, M.middle.y];
    const sd = M.middle.scan_dir;
    const d = (sd && typeof sd === "object") ? (sd[String(r)] || "lr") : (sd || "lr");
    return d === "rl" ? [a, b] : [b, a];
  }
  if (area === "arc") return arcPoints(tk, r);
  if (area === "inner") {
    /* 投篮时扫描线放到三分线内侧（球线 X=9 的右边），更贴投篮点 */
    const x = (tk === "shoot" && M.inner.x_shoot != null)
            ? M.inner.x_shoot : M.inner.x;
    const a = [x, M.inner.top_y], b = [x, M.inner.bottom_y];
    const d = (tk === "shoot") ? (M.inner.dir_shoot || "tb")
                               : (M.inner.dir_pass || "bt");
    return d === "bt" ? [b, a] : [a, b];
  }
  return [];
}

/* ═══════════════════════════════════════════════════════════════════
   路线模型 —— 功能性节点 + 可增删的途经点
   ═══════════════════════════════════════════════════════════════════ */

/* 功能性节点：位置写在别的字段里，名字是固定的，不允许删 */
const NODE_LABEL = {
  start:    "出发点",
  entry:    "进场点",
  corridor: "上侧通道",
  passPt:   "传球点",
  shootPt:  "投篮点"
};
function isAreaTok(t) { return typeof t === "string" && t.charAt(0) === "@"; }
function isWaypoint(t) { return Array.isArray(t); }
function isNodeTok(t) { return typeof t === "string" && !isAreaTok(t); }

/* 功能性节点的坐标（由别的字段间接决定） */
function tokenPoint(tok) {
  const M = S.match;
  switch (tok) {
    case "start":    return M.start;
    case "entry":    return M.entry;
    case "corridor": return M.corridor;
    case "passPt":   return M.release.pass.point;
    case "shootPt":  return M.release.shoot.point;
    /* 绕半场置球线的横穿点：X 取 carry_cross_x_m，Y 取上侧通道的高度。
       以前 route 表里把它写成字面量 [4.8, 6.8]，通道一改它不会跟着动，
       图上看着和实际走的不一样。改成命名节点后就跟着 corridor 走了。 */
    case "cross":    return [M.carry_cross_x_m, M.corridor[1]];
    default:         return null;
  }
}

/* 取某一轮某一任务的走法列表（没有就用默认建一份） */
function routeList(tk, r) {
  if (!S.route[tk]) S.route[tk] = JSON.parse(JSON.stringify(DEFAULTS.route[tk] || {}));
  const k = String(r);
  if (!S.route[tk][k])
    S.route[tk][k] = JSON.parse(JSON.stringify((DEFAULTS.route[tk] || {})[k] || []));
  return S.route[tk][k];
}

/* 把走法列表展开成【逐个坐标点】，并带上来源信息（画图/编号/命中都用它） */
function routeSeq(r, tk) {
  tk = tk || task;
  if (r === "all") return [];
  const out = [];
  const list = routeList(tk, r);
  for (let ti = 0; ti < list.length; ti++) {
    const tok = list[ti];
    if (isAreaTok(tok)) {
      const area = tok.slice(1);
      areaPoints(area, r, tk).forEach((p, i) => out.push({
        pt: p, tok, tokIndex: ti, area, kind: "area", sub: i
      }));
    } else if (isWaypoint(tok)) {
      out.push({ pt: tok, tok, tokIndex: ti, kind: "wp" });
    } else {
      const p = tokenPoint(tok);
      if (p) out.push({ pt: p, tok, tokIndex: ti, kind: "node" });
    }
  }
  return out;
}

/* 去程/回程：去程完全由 route 决定；回程固定（出球点→通道→进场点→出发区） */
function routePathFor(r, tk) {
  return routeSeq(r, tk).map(e => e.pt);
}
function returnPathFor(tk) {
  const M = S.match;
  const end = ((tk || task) === "shoot") ? M.release.shoot.point : M.release.pass.point;
  return [end.slice(), M.corridor.slice(), M.entry.slice(), M.start.slice()];
}

/* ═══════════════════════════════════════════════════════════════════
   坐标换算
   ═══════════════════════════════════════════════════════════════════ */
const PX = 56;                        // 每米像素
const PAD = { l: 74, r: 46, t: 58, b: 42 };
const Y_TOP = 8.7, Y_BOT = -1.05;
const FL = 14, FW = 7.5;
const W = PAD.l + FL * PX + PAD.r;
const H = PAD.t + (Y_TOP - Y_BOT) * PX + PAD.b;

/* ══════════════════════════════════════════════════════════════════════
   ⚠️ 现在场上有【三套】坐标，别混：

   ① 内部/图纸帧（本文件内部存储 + 画图用，也是 mission.yaml 用的）
        x 沿 14m 长边，原点在远离篮筐那条底线
        y 沿 7.5m 短边， 0 = 下边线， 7.5 = 上边线， 3.75 = 宽度中线

   ② 新帧 = tools/match_rounds.json 用的（**导出给小车的就是这套**）
        "coordinate_y_offset_m": -3.75
        x 不变（仍沿 14m 长边，原点在底线）
        y 从【宽度中线】起算： 0 = 中线， −3.75 = 下边线， +3.75 = 上边线
        ⇒ 换算： 新.y = 旧.y − 3.75      旧.y = 新.y + 3.75
        ⇒ 原点 (0,0) = 旧帧 (0, 3.75) = 【中线最左端】 ✔ 你要的那个

   ③ jituo 公开帧（tools/field_coordinates.py，**只给控制台前端/API 看**）
        公开.x = 7.5 − 旧.y − 3.725      公开.y = 旧.x     ← 这是 90° 旋转！
        ⚠️ 原点和②一样，但【坐标轴差了 90°】。常数是 3.725 而不是 3.75，
           差 2.5cm。别和②混用。

   ⇒ 本文件：内部 = ①，面板显示/编辑 = ②，导出 match_rounds.json = ②，
             导出 mission.yaml = ①（mission 节点没跟着偏，见 mission.yaml 的 y=3.75）
   ══════════════════════════════════════════════════════════════════════ */
const Y0 = -3.75;                       // ②的偏移： 新.y = 旧.y + Y0
const toY = v => r2(v + Y0);            // 旧 → 新（面板显示、图上标注）
const fromY = v => r2(v - Y0);          // 新 → 旧（面板输入、导入）
function pubText2(x, y) { const p = [r2(FW - y - PUB_XO), r2(x)]; return `公开(旋转) (${fmt(p[0])}, ${fmt(p[1])})`; }
const PUB_XO = 3.725;                  // field_coordinates.json 的 x_origin_m
const PUB_MID_Y = 5.75;                // midfield_y_m
const toPub = (x, y) => [r2(FW - y - PUB_XO), r2(x)];
const toLeg = (X, Y) => [r2(Y), r2(FW - X - PUB_XO)];
function pubText(x, y) { const p = toPub(x, y); return `(${fmt(p[0])}, ${fmt(p[1])})`; }

const F2X = x => PAD.l + x * PX;
const F2Y = y => PAD.t + (Y_TOP - y) * PX;
/* 模型值的 y 上屏：选 B 时先镜像。常量（Y_TOP/Y_BOT/FW/数字）继续用 F2Y。 */
const G2Y = y => F2Y(mirY(y));
const X2F = px => (px - PAD.l) / PX;
const Y2F = py => mirY(Y_TOP - (py - PAD.t) / PX);

const svg = document.getElementById("svg");
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
}
const r2 = v => Math.round(v * 1000) / 1000;
/* 显示用：最多 2 位小数，并去掉末尾多余的 0
   4.80 → "4.8"   10.45 → "10.45"   7.5444 → "7.54"
   ⚠️ 只是排版用，不改数据。数据该有的精度仍由 r2 保留。 */
const fmt = (v, n) => {
  if (v == null || !isFinite(v)) return String(v);
  const p = Math.pow(10, n == null ? 2 : n);
  return String(Math.round(v * p) / p);
};
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

/* ═══════════════════════════════════════════════════════════════════
   拖动句柄定义 —— 每个可拖的点在这里登记
   ═══════════════════════════════════════════════════════════════════ */
/* 当前任务/轮次该用哪组角度（返回【数组引用】，拖动弧点时直接改它） */
function arcAnglesRef(tk, r) {
  const a = S.match.arc;
  tk = tk || task;
  r = (r === undefined) ? round : r;
  if (tk === "shoot" && a.radius_shoot != null && a.angles_shoot) {
    if (typeof a.angles_shoot === "object" && !Array.isArray(a.angles_shoot)) {
      const k = String(r);
      if (!a.angles_shoot[k])
        a.angles_shoot[k] = JSON.parse(JSON.stringify(a.angles_deg));
      return a.angles_shoot[k];
    }
    if (Array.isArray(a.angles_shoot)) return a.angles_shoot;
  }
  return a.angles_deg;
}
/* 当前任务该用哪个深场扫描线 x（投篮在三分线内侧）*/
function innerX(tk) {
  const I = S.match.inner;
  tk = tk || task;
  return (tk === "shoot" && I.x_shoot != null) ? I.x_shoot : I.x;
}
/* 当前任务该用哪个扫描半径 */
function arcRadius(tk) {
  const a = S.match.arc;
  tk = tk || task;
  return (tk === "shoot" && a.radius_shoot != null) ? a.radius_shoot : a.radius;
}
function arcPoints(tk, r) {
  const a = S.match.arc;
  const R = arcRadius(tk);
  return arcAnglesRef(tk, r).map(d => {
    const t = d * Math.PI / 180;
    return [a.center[0] + R * Math.cos(t),
            a.center[1] + R * Math.sin(t)];
  });
}

function handles() {
  const M = S.match, F = S.mission;
  const hs = [];
  const seen = new Set();
  const add = (id, layer, label, get, set, opts) => {
    /* 走法里同一个节点可能出现两次（比如每轮两次出球），
       但它只有一个位置，所以句柄只画一次 */
    if (seen.has(id)) return;
    seen.add(id);
    hs.push(Object.assign({ id, layer, label, get, set }, opts || {}));
  };

  /* 起步 */
  add("start",    "base", "出发点 A",   () => M.start,       (x, y) => M.start = [x, y]);
  add("entry",    "base", "进场点",     () => M.entry,       (x, y) => M.entry = [x, y]);
  add("corridor", "base", "上侧通道",   () => M.corridor,    (x, y) => M.corridor = [x, y]);

  /* 中线：两个点共用 y，所以拖任一个都改 y */
  add("midR", "middle", "中线右端", () => [M.middle.right_x, M.middle.y],
      (x, y) => { M.middle.right_x = x; M.middle.y = y; });
  add("midL", "middle", "中线左端", () => [M.middle.left_x, M.middle.y],
      (x, y) => { M.middle.left_x = x; M.middle.y = y; });

  /* ── 弧线 ──────────────────────────────────────────────────────
     圆心、半径句柄，再加上【每个弧点各一个句柄】。
     拖弧点 = 让它沿圆弧滑动 → 只改这一个点的角度，圆本身不变。
     （若允许把弧点拖离圆，弧线就不再是圆了，所以特意做成"贴圆滑动"。）
     ──────────────────────────────────────────────────────────── */
  add("arcC", "arc", "弧线圆心", () => M.arc.center,
      (x, y) => M.arc.center = [x, y]);
  const _arcR = () => arcRadius(task);
  const _arcRset = (x) => {
    const v = r2(Math.max(0.5, x - M.arc.center[0]));
    if (task === "shoot" && M.arc.radius_shoot != null) M.arc.radius_shoot = v;
    else M.arc.radius = v;
  };
  add("arcR", "arc", `弧线半径（${task === "shoot" ? "投篮·内侧" : "传球·外侧"}）`,
      () => [M.arc.center[0] + _arcR(), M.arc.center[1]], _arcRset);
  const _ref = arcAnglesRef(task, round);
  arcPoints(task, round).forEach((p, i) => {
    add("arcP" + i, "arc",
        `弧点 ${i + 1}（当前 ${_ref[i]}°）`,
        () => arcPoints(task, round)[i],
        (x, y) => {
          /* 拖到哪，就把这个点的角度设成"圆心指向该处"的角度 */
          const dx = x - M.arc.center[0], dy = y - M.arc.center[1];
          _ref[i] = Math.round(Math.atan2(dy, dx) * 1800 / Math.PI) / 10;
        },
        { arcIdx: i });
  });

  /* 深场 */
  const _setIX = (x) => {
    if (task === "shoot" && M.inner.x_shoot != null) M.inner.x_shoot = x;
    else M.inner.x = x;
  };
  add("innT", "inner", `深场上点（${task === "shoot" ? "投篮·三分线内侧" : "传球"}）`,
      () => [innerX(task), M.inner.top_y],
      (x, y) => { _setIX(x); M.inner.top_y = y; });
  add("innB", "inner", `深场下点（${task === "shoot" ? "投篮·三分线内侧" : "传球"}）`,
      () => [innerX(task), M.inner.bottom_y],
      (x, y) => { _setIX(x); M.inner.bottom_y = y; });

  /* 出球点：只显示当前任务那一个（传球/投篮点不一样） */
  if (task === "pass") {
    add("passPt", "release", "传球点", () => M.release.pass.point,
        (x, y) => M.release.pass.point = [x, y]);
  } else {
    add("shootPt", "release", "投篮点", () => M.release.shoot.point,
        (x, y) => M.release.shoot.point = [x, y]);
    if (M.release.shoot.aim)
      add("shootAim", "release", "投篮瞄准", () => M.release.shoot.aim,
          (x, y) => M.release.shoot.aim = [x, y]);
  }

  /* ── 自定义途经点（可增删；功能性节点不在这里）──────────────── */
  if (round !== "all") {
    routeList(task, round).forEach((t, ti) => {
      if (!isWaypoint(t)) return;
      add("wp" + ti, "wp", `途经点（走法第 ${ti + 1} 位）`, () => t,
          (x, y) => { t[0] = x; t[1] = y; },
          { deletable: true, tokIndex: ti });
    });
  }

  /* 场地几何（mission.yaml） */
  add("hoop", "mission", "篮筐", () => F.hoop, (x, y) => F.hoop = [x, y]);
  add("tpC", "mission", "三分线圆心", () => F.three_point_center,
      (x, y) => F.three_point_center = [x, y]);
  add("midCircle", "mission", "中线置球区心",
      () => [F.front_zone_circle.x, F.front_zone_circle.y],
      (x, y) => { F.front_zone_circle.x = x; F.front_zone_circle.y = y; });
  add("pzT", "mission", "传球区左上", () => F.pass_zone[3],
      (x, y) => { F.pass_zone[0][0] = x; F.pass_zone[3] = [x, y]; F.pass_zone[2][0] = F.pass_zone[2][0]; });
  add("pzB", "mission", "传球区右下", () => F.pass_zone[1],
      (x, y) => { F.pass_zone[1] = [x, y]; F.pass_zone[2][1] = y; });
  add("sz", "mission", "出发区A心", () => F.start_zones.A,
      (x, y) => { F.start_zones.A = [x, y]; F.home = [x, y]; });

  /* 定位柱 */
  /* jituo/main 已删除 localization.yaml 的 landmarks 段 ⇒ 没有就不画这个句柄 */
  if (S.landmarks && S.landmarks.passing_pillar_A)
    add("lmPass", "lm", "传球柱",
        () => [S.landmarks.passing_pillar_A.x, S.landmarks.passing_pillar_A.y],
        (x, y) => { S.landmarks.passing_pillar_A.x = x; S.landmarks.passing_pillar_A.y = y; });

  return hs;
}

/* ═══════════════════════════════════════════════════════════════════
   画图
   ═══════════════════════════════════════════════════════════════════ */
function draw() {
  svg.innerHTML = "";
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W);
  svg.setAttribute("height", H);

  const M = S.match, F = S.mission;

  /* ── 网格 ── */
  if (showGrid) {
    const g = el("g", {});
    for (let x = 0; x <= FL; x += 0.5)
      el("line", { x1: F2X(x), y1: F2Y(Y_TOP), x2: F2X(x), y2: F2Y(Y_BOT),
                   stroke: x % 1 ? "#f0f0ec" : "#e4e4df", "stroke-width": 1 }, g);
    for (let y = 0; y <= FW; y += 0.5)
      el("line", { x1: F2X(0), y1: F2Y(y), x2: F2X(FL), y2: F2Y(y),
                   stroke: y % 1 ? "#f0f0ec" : "#e4e4df", "stroke-width": 1 }, g);
  }

  /* ── 场外带 ── */
  el("rect", { x: F2X(0), y: F2Y(Y_TOP), width: FL * PX, height: (Y_TOP - FW) * PX,
               fill: "#eceae5" });
  el("text", { x: F2X(10.6), y: F2Y(Y_TOP) + 17, fill: "#a2a29c", "font-size": 11 })
    .textContent = "场地以外";

  /* ── 场地本体 ── */
  el("rect", { x: F2X(0), y: F2Y(FW), width: FL * PX, height: FW * PX,
               fill: "#fff", stroke: "#26262a", "stroke-width": 2.5 });

  /* ── 场地几何 layer ── */
  if (LAYERS.mission) {
    const g = el("g", { opacity: .85 });
    /* 中线 */
    el("line", { x1: F2X(0), y1: F2Y(FW / 2), x2: F2X(FL), y2: F2Y(FW / 2),
                 stroke: "#ded0a0", "stroke-width": 1.5 }, g);
    /* 中线置球区圆 */
    el("circle", { cx: F2X(F.front_zone_circle.x), cy: G2Y(F.front_zone_circle.y),
                   r: F.front_zone_circle.radius_m * PX, fill: "none",
                   stroke: "#b8b8b2", "stroke-width": 1.5 }, g);
    /* 三分线弧 */
    el("path", {
      d: arcPath(F.three_point_center, F.three_point_radius_m, 95, 265),
      fill: "none", stroke: "#4ba3bd", "stroke-width": 2
    }, g);
    /* 投篮线弧 */
    el("path", {
      d: arcPath(F.hoop, F.shoot_line_radius_m, 100, 260),
      fill: "none", stroke: "#c07820", "stroke-width": 1.5 }, g);
    /* 传球区多边形（占位值 → 虚线提醒） */
    el("polygon", {
      points: F.pass_zone.map(p => `${F2X(p[0])},${G2Y(p[1])}`).join(" "),
      fill: "rgba(140,62,200,.05)", stroke: "#8c3ec8", "stroke-width": 1.5,
      "stroke-dasharray": "6 4"
    }, g);
    txt(g, `传球区（占位）`, F2X(8.2), F2Y(6.5) - 8, "#8c3ec8", 11);
    txt(g, "三分线 R" + F.three_point_radius_m, F2X(11), F2Y(0.5), "#4ba3bd", 11, "middle");
    txt(g, "投篮线 R" + F.shoot_line_radius_m, F2X(12.2), F2Y(1.6), "#c07820", 11, "end");
    txt(g, "中线置球区 R" + F.front_zone_circle.radius_m,
        F2X(0.4), F2Y(5.7), "#9c9c96", 11);

    /* ── 半场置球区（绿竖线 X=5.75）—— 第2/3回合线上 4 个干扰球 ── */
    if (F.half_line) {
      const h = F.half_line;
      el("line", { x1: F2X(h.x), y1: G2Y(h.y_top), x2: F2X(h.x), y2: G2Y(h.y_bottom),
                   stroke: "#1f9152", "stroke-width": 3 }, g);
      txt(g, `半场置球区 X=${h.x}`, F2X(h.x) - 5, G2Y(h.y_top) - 6, "#1f9152", 11, "end");
    }

    /* ── 三分线内置球区（红竖线 X=9）── 官方图：距右边线 5000 ── */
    if (F.inner_line) {
      const ix = F.inner_line.x;
      /* 长度 = 该竖线在三分圆内的弦：|y−3.75| ≤ sqrt(R²−(x−11)²) */
      const dy = Math.sqrt(Math.max(0, F.three_point_radius_m ** 2 -
                                      (ix - F.three_point_center[0]) ** 2));
      const y0 = F.three_point_center[1] - dy, y1 = F.three_point_center[1] + dy;
      el("line", { x1: F2X(ix), y1: G2Y(y1), x2: F2X(ix), y2: G2Y(y0),
                   stroke: "#d63c3c", "stroke-width": 3 }, g);
      txt(g, `三分线内置球区 X=${ix}`, F2X(ix) - 5, G2Y(y0) + 14, "#d63c3c", 11, "end");
      txt(g, `y∈[${y0.toFixed(2)}, ${y1.toFixed(2)}]`, F2X(ix) - 5, G2Y(y0) + 27,
          "#c06060", 10, "end");
    }

    /* ── A 方传球目标区（图注：都在上边线上）── */
    if (F.pass_targets_A) {
      for (const t of F.pass_targets_A) {
        el("rect", { x: F2X(t.x) - 8, y: G2Y(t.y) - 8, width: 16, height: 16,
                     fill: "none", stroke: "#8c3ec8", "stroke-width": 2,
                     "stroke-dasharray": "3 2" }, g);
        el("path", { d: `M${F2X(t.x)},${G2Y(t.y) - 9} l0,-9`, stroke: "#8c3ec8",
                     "stroke-width": 1 }, g);
        txt(g, t.name, F2X(t.x), G2Y(t.y) - 22, "#8c3ec8", 10, "middle");
      }
      txt(g, "A方传球目标区（上边线上）", F2X(2.2), F2Y(Y_TOP) - 4, "#8c3ec8", 11);
    }

    /* 三分线圆心（参考）—— 标签放在左上，避免和弧线/深场标注重叠 */
    dot(g, F.three_point_center, "#4ba3bd", 3.5);
    txt(g, "3分心", F2X(F.three_point_center[0]) - 4,
        G2Y(F.three_point_center[1]) + 16, "#4ba3bd", 10, "end");

    /* 篮筐 */
    dot(g, F.hoop, "#c07820", 6);
    txt(g, `篮筐 ${fmt(F.hoop[0])}, ${fmt(F.hoop[1])}`,
        F2X(F.hoop[0]), G2Y(F.hoop[1]) - 20, "#a05f10", 12, "middle");
  }

  /* ══════════════════════════════════════════════════════════════════
     坐标轴：原点在【中线最左端】
        内部/图纸帧 = 旧帧： y=0 下边线, y=3.75 中线, y=7.5 上边线
        导出的 match_rounds.json = 新帧： y=0 中线, y=−3.75 下边线, y=+3.75 上边线
     ⇒ 图上的 y 刻度按【新帧】标（这是车实际读到的数），旧帧刻度画淡作对照
     ══════════════════════════════════════════════════════════════════ */
  const oX = F2X(0), oY = F2Y(FW / 2);          // 新帧原点 = 旧帧 (0, 3.75) = 中线左端

  /* ── +y（新帧）朝上 = 屏幕向上 ── */
  el("line", { x1: oX - 26, y1: oY, x2: oX - 26, y2: F2Y(Y_TOP) + 6,
               stroke: "#3a6cb8", "stroke-width": 2.5 });
  el("polygon", { points: `${oX - 26},${F2Y(Y_TOP) - 4} ${oX - 30},${F2Y(Y_TOP) + 6} ${oX - 22},${F2Y(Y_TOP) + 6}`,
                  fill: "#3a6cb8" });
  txt(svg, `y ↑  中线=0  上边线=+${fmt(FW / 2)}`, oX - 32, F2Y(Y_TOP) + 20, "#3a6cb8", 11, "end");

  /* ── +x（新帧）朝篮筐 = 屏幕向右 ── */
  el("line", { x1: oX, y1: F2Y(Y_BOT) + 14, x2: F2X(FL) + 16, y2: F2Y(Y_BOT) + 14,
               stroke: "#b04a3a", "stroke-width": 2.5 });
  el("polygon", { points: `${F2X(FL) + 24},${F2Y(Y_BOT) + 14} ${F2X(FL) + 15},${F2Y(Y_BOT) + 10} ${F2X(FL) + 15},${F2Y(Y_BOT) + 18}`,
                  fill: "#b04a3a" });
  txt(svg, "x →（朝篮筐，14m）", F2X(FL) + 28, F2Y(Y_BOT) + 18, "#b04a3a", 11);

  /* ── B 出发预览横幅 ── */
  if (FLIP()) {
    el("rect", { x: F2X(0) + 6, y: F2Y(Y_TOP) + 6, width: 448, height: 40,
                 rx: 6, fill: "#fff4e6", stroke: "#e8590c", "stroke-width": 2 });
    txt(svg, "预览：B 区出发（整张图关于场地中线镜像）", F2X(0) + 18,
        F2Y(Y_TOP) + 24, "#b34700", 13, "start");
    txt(svg, "导出给小车的仍然只有 A 帧那一份，代码会自己镜像", F2X(0) + 18,
        F2Y(Y_TOP) + 40, "#b34700", 11, "start");
  }

  /* ── 新原点 ── */
  el("circle", { cx: oX, cy: oY, r: 5.5, fill: "#fff", stroke: "#26262a", "stroke-width": 2.5 });
  el("circle", { cx: oX, cy: oY, r: 1.8, fill: "#26262a" });
  txt(svg, "原点 (0,0) = 中线最左端", oX + 12, oY - 9, "#26262a", 12, "start");
  txt(svg, "导出给小车的新帧 (0,0)　内部旧帧 (0, 3.75)", oX + 12, oY + 5, "#6b6b66", 10);

  /* ── 四边的 y 值（新帧刻度）── */
  txt(svg, "y=−3.75 下边线", F2X(FL) - 6, F2Y(0) + 16, "#8a8a84", 10, "end");
  txt(svg, `y=+${fmt(FW / 2)} 上边线`, F2X(0) + 6, F2Y(FW) - 7, "#8a8a84", 10);
  txt(svg, "y=0 中线", F2X(3.2) + 6, F2Y(FW / 2) - 6, "#26262a", 10);

  /* ── jituo 公开帧参照（90°旋转那套，只给控制台对数；原点同、轴不同）── */
  txt(svg, `公开(旋转) x=${fmt(toPub(FL, 0)[0])}`, F2X(FL) - 6, F2Y(0) + 28, "#c0c0ba", 9, "end");
  txt(svg, `公开(旋转) x=${fmt(toPub(0, FW)[0])}`, F2X(0) + 6, F2Y(FW) + 6, "#c0c0ba", 9);

  /* ── 路线连线（画在圆点下面）─────────────────────────────────
     点与点之间【始终相连】：一条完整的去程，加一条虚线的回程。
     选单轮时就是那一轮的一条路；选"全部"时三轮各一条自己的颜色。 */
  drawRoutes();

  /* ── 起步 layer ── */
  if (visible("base")) {
    const g = el("g", {});
    const sz = F.start_zone_size_m / 2;
    el("rect", { x: F2X(F.start_zones.A[0] - sz), y: G2Y(F.start_zones.A[1] + sz),
                 width: F.start_zone_size_m * PX, height: F.start_zone_size_m * PX,
                 fill: "none", stroke: COL.base, "stroke-width": 2, "stroke-dasharray": "5 3" }, g);
    txt(g, "出发区 A", F2X(F.start_zones.A[0] + sz) + 6,
        G2Y(F.start_zones.A[1]) + 4, COL.base, 11);
  }

  /* ── 中线 layer ── */
  if (visible("middle")) {
    const g = el("g", {});
    const a = [M.middle.right_x, M.middle.y], b = [M.middle.left_x, M.middle.y];
    for (const p of [a, b]) dot(g, p, COL.middle, 7);
    txt(g, `② 中线 (${fmt(M.middle.right_x)},${fmt(toY(M.middle.y))}) → (${fmt(M.middle.left_x)},${fmt(toY(M.middle.y))})`,
        F2X((a[0] + b[0]) / 2), G2Y(M.middle.y) + 42, COL.middle, 11, "middle");
    txt(g, `scoop ${fmt(M.middle.scoop_m)}`, F2X((a[0] + b[0]) / 2), G2Y(M.middle.y) + 56,
        "#b06a6a", 10, "middle");
  }

  /* ── 弧线 layer ── */
  if (visible("arc")) {
    const g = el("g", {});
    const pts = arcPoints();
    for (const p of pts) dot(g, p, COL.arc, 6);
    /* 圆心 + 半径句柄 的虚线 */
    el("line", { x1: F2X(M.arc.center[0]), y1: G2Y(M.arc.center[1]),
                 x2: F2X(M.arc.center[0] + M.arc.radius), y2: G2Y(M.arc.center[1]),
                 stroke: COL.arc, "stroke-width": 1, "stroke-dasharray": "3 3", opacity: .5 }, g);
    const tp = pts[pts.length - 1];
    txt(g, `③ 弧线 R${fmt(arcRadius(task))}${task === "shoot" ? "（内）" : "（外）"}`, F2X(tp[0]) + 12, G2Y(tp[1]) + 2, COL.arc, 11);
    txt(g, `scoop ${fmt(M.arc.scoop_m)}`, F2X(tp[0]) + 12, G2Y(tp[1]) + 16, "#6f8fc0", 10);
  }

  /* ── 深场 layer ── */
  if (visible("inner")) {
    const g = el("g", {});
    const _ix = innerX(task);
    const a = [_ix, M.inner.top_y], b = [_ix, M.inner.bottom_y];
    for (const p of [a, b]) dot(g, p, COL.inner, 6);
    const my = (M.inner.top_y + M.inner.bottom_y) / 2;
    txt(g, `④ 深场 x=${fmt(_ix)}${task === "shoot" ? "（三分线内侧）" : ""}`,
        F2X(_ix) + 12, G2Y(my) - 3, COL.inner, 11);
    txt(g, `scoop ${fmt(M.inner.scoop_m)}`, F2X(_ix) + 12, G2Y(my) + 11, "#4f9e73", 10);
  }

  /* ── 出球点 layer（只看当前任务那一个）── */
  if (visible("release")) {
    const g = el("g", {});
    if (task === "pass") {
      const pp = M.release.pass.point;
      const hd = (M.release.pass.search_heading_deg || 0) * Math.PI / 180;
      el("line", { x1: F2X(pp[0]), y1: G2Y(pp[1]),
                   x2: F2X(pp[0] + 2.2 * Math.cos(hd)), y2: G2Y(pp[1] + 2.2 * Math.sin(hd)),
                   stroke: COL.release, "stroke-width": 1.5, "stroke-dasharray": "5 3" }, g);
      txt(g, `传球朝向 ${M.release.pass.search_heading_deg}°`,
          F2X(pp[0]) - 10, G2Y(pp[1]) - 30, COL.release, 10, "end");
      el("rect", { x: F2X(pp[0]) - 6, y: G2Y(pp[1]) - 6, width: 12, height: 12,
                   fill: COL.release, stroke: "#fff", "stroke-width": 2 }, g);
    } else {
      const sp = M.release.shoot.point;
      if (M.release.shoot.aim) {
        el("line", { x1: F2X(sp[0]), y1: G2Y(sp[1]),
                     x2: F2X(M.release.shoot.aim[0]), y2: G2Y(M.release.shoot.aim[1]),
                     stroke: COL.shoot, "stroke-width": 1.6, "stroke-dasharray": "5 3" }, g);
        txt(g, "投篮瞄准篮筐", F2X(9.6), F2Y(3.05), COL.shoot, 10);
      }
      el("rect", { x: F2X(sp[0]) - 6, y: G2Y(sp[1]) - 6, width: 12, height: 12,
                   fill: COL.shoot, stroke: "#fff", "stroke-width": 2 }, g);
    }
  }

  /* ── 定位柱 layer ── */
  if (visible("lm")) {
    const g = el("g", {});
    for (const [name, lm] of Object.entries(S.landmarks || {})) {
      if (lm.x == null || lm.y == null) continue;
      const on = lm.enabled;
      el("circle", { cx: F2X(lm.x), cy: G2Y(lm.y), r: 7,
                     fill: on ? COL.lm : "none",
                     stroke: on ? "#fff" : "#bbb", "stroke-width": 2,
                     opacity: on ? 1 : .5 }, g);
      const short = name === "passing_pillar_A" ? "传球柱" : "投篮柱";
      txt(g, on ? short : short + "（未启用）",
          F2X(lm.x) + 11, G2Y(lm.y) + 17, on ? COL.lm : "#aaa", 10);
    }
  }

  /* ── 拖动句柄（最后画，保证在最上层） ── */
  const hs = handles();
  for (const h of hs) {
    if (!visible(h.layer)) continue;
    const p = h.get();
    if (!p || p[0] == null || p[1] == null) continue;
    const g = el("g", {
      class: "hnd" + (selId === h.id ? " sel" : ""),
      "data-id": h.id
    });
    const col = COL[h.layer] || "#333";

    /* 连线模式下，已经被点过的 token 加一圈标记 */
    const li = linkMode ? linkBuf.indexOf(h.id) : -1;
    if (li >= 0)
      el("circle", { cx: F2X(p[0]), cy: G2Y(p[1]), r: 12, fill: "none",
                     stroke: "#e08a1e", "stroke-width": 3, opacity: .9 }, g);

    el("circle", { class: "hit", cx: F2X(p[0]), cy: G2Y(p[1]), r: 13 }, g);
    el("circle", { class: "vis", cx: F2X(p[0]), cy: G2Y(p[1]), r: 6.5,
                   fill: "#fff", stroke: col, "stroke-width": 2.5 }, g);
    /* 连线模式：在点上显示"是第几步" */
    if (li >= 0) {
      const t = el("text", { x: F2X(p[0]), y: G2Y(p[1]) - 14, "font-size": 10,
                             "text-anchor": "middle", fill: "#e08a1e",
                             "font-weight": "700" }, g);
      t.textContent = `第${li + 1}步`;
    }

    /* 途经点：右边挂个 × 用来删（功能性节点没有这个） */
    if (h.deletable) {
      const bx = F2X(p[0]) + 13, by = G2Y(p[1]) - 13;
      const del = el("g", { style: "cursor:pointer" }, g);
      el("circle", { cx: bx, cy: by, r: 8, fill: "#e0554a", stroke: "#fff",
                     "stroke-width": 1.5 }, del);
      const xt = el("text", { x: bx, y: by + 3.4, "font-size": 10,
                              "text-anchor": "middle", fill: "#fff",
                              "font-weight": "700" }, del);
      xt.textContent = "×";
      del.addEventListener("pointerdown", ev => {
        ev.stopPropagation(); ev.preventDefault();
        selId = h.id;
        deleteSel();
      });
      /* 让 × 不被"拖动"抢走 */
      del.addEventListener("pointerenter", ev => tipArm(ev, "删除这个途经点", null));
    }

    /* 悬停：先给出【这个点的坐标】，再接原来的解释 */
    const tipKey = HANDLE_TIP[h.id];
    const tipTxt = tipKey ? TIP_TEXT[tipKey] : null;
    const coordTip = () => {
      let p = null;
      try { p = h.get(); } catch (e) { return tipTxt || null; }
      if (!Array.isArray(p) || p.length < 2 || typeof p[1] !== "number") return tipTxt || null;
      const nx = r2(p[0]), ny = toY(p[1]);
      let html = `<span style="font-size:15px;font-weight:700;color:#1f6feb">`
               + `x=${fmt(nx)}　y=${fmt(ny)}</span>`
               + `<br><span style="opacity:.72;font-size:11px">这是导出给小车的新帧（中线 y=0）</span>`
               + `<br><span style="opacity:.55;font-size:11px">内部/图纸旧帧 x=${fmt(p[0])} y=${fmt(p[1])}`
               + `　·　${pubText2(p[0], p[1])}</span>`;
      if (tipTxt) html += `<div style="margin-top:5px;border-top:1px solid #ddd;padding-top:5px">${tipTxt}</div>`;
      return html;
    };
    g.addEventListener("pointerenter", ev => tipArm(ev, h.label, coordTip()));
    g.addEventListener("pointermove", ev => {
      tipEv = ev;
      if (!tipEl.classList.contains("on")) return;
      /* 拖动时坐标会变 —— 把提示文字也刷新一遍 */
      const body = tipEl.querySelector(".tipbody");
      if (body) body.innerHTML = coordTip() || "";
      tipMoveTo(ev);
    });
    g.addEventListener("pointerleave", tipHide);

    /* 按下：连线模式 = 记一步；否则 = 选中 + 开始拖动 */
    g.addEventListener("pointerdown", ev => {
      tipHide();
      if (linkMode) {
        ev.preventDefault();
        /* 区域点 → 记成整块 @区域，避免只连一个弧点 */
        const tok = (h.layer === "middle" ? "@middle"
                   : h.layer === "arc" ? "@arc"
                   : h.layer === "inner" ? "@inner"
                   : h.id);
        linkPush(tok);
        return;
      }
      selId = h.id;
      startDrag(ev, h);
    });
  }

  /* ── 连线模式的浮层提示 ── */
  const hud = el("g", {});
  if (linkMode) {
    const n = linkBuf.length;
    txt(hud, `连线模式：已点 ${n} 个。依次点各个点排出新走法`,
        F2X(0.05), F2Y(Y_TOP) + 16, "#b4720f", 12);
    txt(hud, "区域（中线/弧线/深场）点一下就是整块；打完点右上「完成连线」",
        F2X(0.05), F2Y(Y_TOP) + 32, "#b4720f", 11);
  } else if (addMode) {
    txt(hud, "加点模式：在地图上点一下，就在【选中点】后面插一个途经点",
        F2X(0.05), F2Y(Y_TOP) + 16, "#b4720f", 12);
  }

  drawPanel();
  renderRouteEditor();
  scheduleSave();          /* 每次重画后延时自动存一次本地（防刷新丢） */
}

function txt(parent, s, x, y, fill, size, anchor) {
  const t = el("text", { x, y, fill, "font-size": size, class: "lbl" }, parent);
  if (anchor) t.setAttribute("text-anchor", anchor);
  t.textContent = s;
  return t;
}
function dot(parent, p, fill, r) {
  return el("circle", { cx: F2X(p[0]), cy: G2Y(p[1]), r, fill }, parent);
}
function line(parent, a, b, stroke, w, dash) {
  const at = { x1: F2X(a[0]), y1: G2Y(a[1]), x2: F2X(b[0]), y2: G2Y(b[1]),
               stroke, "stroke-width": w };
  if (dash) at["stroke-dasharray"] = dash;
  return el("line", at, parent);
}
function polyline(pts) {
  return pts.map((p, i) => `${i ? "L" : "M"}${F2X(p[0])},${G2Y(p[1])}`).join(" ");
}

/* 沿路径画方向箭头（小三角），让人看清车往哪开 */
function arrows(parent, pts, color) {
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    if (Math.hypot(dx, dy) < 0.30) continue;        // 太短的段不画，免得糊成一团
    const mx = F2X(a[0] + dx * 0.55), my = G2Y(a[1] + dy * 0.55);
    const ang = Math.atan2(-dy, dx);                // 屏幕 y 反向
    const c = Math.cos(ang), s = Math.sin(ang);
    const tip = [mx + 6.5 * c, my + 6.5 * s];
    const b1 = [mx - 4 * c + 4 * s, my - 4 * s - 4 * c];
    const b2 = [mx - 4 * c - 4 * s, my - 4 * s + 4 * c];
    el("polygon", {
      points: `${tip[0]},${tip[1]} ${b1[0]},${b1[1]} ${b2[0]},${b2[1]}`,
      fill: color, opacity: .9
    }, parent);
  }
}

/* 路线：点与点之间始终相连 */
function drawRoutes() {
  if (!showRoute) return;
  const g = el("g", {});

  if (round === "all") {
    /* 全部：三轮各画一条自己的颜色，不跨轮连（跨轮连没有意义） */
    for (const r of [1, 2, 3]) {
      const p = routePathFor(r, task);
      if (p.length < 2) continue;
      for (const area of activeAreasOf(r, task)) {   // 区域高亮带
        const ap = areaPoints(area);
        if (ap.length < 2) continue;
        el("path", { d: polyline(ap), fill: "none", stroke: COL[area],
                     "stroke-width": 7, opacity: .16, "stroke-linecap": "round" }, g);
      }
      el("path", { d: polyline(p), fill: "none", stroke: ROUND_COLOR[r],
                   "stroke-width": 2.2, opacity: .85, "stroke-linejoin": "round" }, g);
      if (showArrows) arrows(g, p, ROUND_COLOR[r]);
    }
    txt(g, "全部模式：红=第1轮  蓝=第2轮  绿=第3轮",
        F2X(0.05), F2Y(0) + 34, "#8a8a84", 11);
    return;
  }

  /* 单轮：一整轮的路（含两次动作 + 回位）。
     最后一个出球点之后的那几段是【回位】，画成虚线。 */
  for (const area of activeAreas()) {
    const ap = areaPoints(area);
    if (ap.length < 2) continue;
    el("path", { d: polyline(ap), fill: "none", stroke: COL[area],
                 "stroke-width": 8, opacity: .16, "stroke-linecap": "round" }, g);
  }
  const seq = routeSeq(round, task);
  const go = seq.map(e => e.pt);

  /* 最后一个出球点的位置 → 之后的算回位 */
  let lastRel = -1;
  seq.forEach((e, i) => { if (e.tok === "passPt" || e.tok === "shootPt") lastRel = i; });
  const homeFrom = lastRel >= 0 ? lastRel : go.length - 1;

  const actionPts = go.slice(0, homeFrom + 1);
  const homePts = go.slice(homeFrom);
  if (actionPts.length >= 2)
    el("path", { d: polyline(actionPts), fill: "none", stroke: "#34343a",
                 "stroke-width": 2.6, "stroke-linejoin": "round",
                 "stroke-linecap": "round" }, g);
  if (homePts.length >= 2)
    el("path", { d: polyline(homePts), fill: "none", stroke: "#a0a09a",
                 "stroke-width": 1.8, "stroke-dasharray": "7 5" }, g);
  if (showArrows) {
    arrows(g, actionPts, "#34343a");
    if (homePts.length >= 2) arrows(g, homePts, "#a0a09a");
  }

  /* ── 步序号：让"下一步去哪"一眼看出来 ──────────────────────
     功能性节点与途经点都编号；区域里的每个扫描点各占一号。
     出球点会出现两次（每轮两次动作），同一个位置重复出现时
     序号往右错开，免得两个数字叠在一起看不清。 */
  const seenPos = {};
  if (showSteps) seq.forEach((e, i) => {
    const key = e.pt[0].toFixed(3) + "," + e.pt[1].toFixed(3);
    const rep = (seenPos[key] = (seenPos[key] || 0) + 1);
    const px = F2X(e.pt[0]) + 13 + (rep - 1) * 21;
    const py = G2Y(e.pt[1]) - 11 - (rep - 1) * 4;
    const isRel = (e.tok === "passPt" || e.tok === "shootPt");
    el("circle", { cx: px, cy: py, r: 9,
                   fill: e.kind === "wp" ? COL.wp : (isRel ? "#34343a" : "#ffffff"),
                   stroke: e.kind === "wp" ? "#ffffff"
                         : (COL[e.area] || "#555"),
                   "stroke-width": 1.6, opacity: .95 }, g);
    const t = el("text", {
      x: px, y: py + 3.6, "font-size": 10, "text-anchor": "middle",
      fill: (e.kind === "wp" || isRel) ? "#ffffff" : "#333", "font-weight": "600"
    }, g);
    t.textContent = String(i + 1);
  });

  /* 起 / 止 标记 */
  const s0 = go[0], sN = go[go.length - 1];
  el("circle", { cx: F2X(s0[0]), cy: G2Y(s0[1]), r: 3.5, fill: "#34343a" }, g);
  el("circle", { cx: F2X(sN[0]), cy: G2Y(sN[1]), r: 3.5, fill: "#34343a" }, g);

  /* ── 图例（放在场地下方，那里最空，不会压住任何标注）── */
  const relSteps = [];
  seq.forEach((e, i) => {
    if (e.tok === "passPt" || e.tok === "shootPt") relSteps.push(i + 1);
  });
  const relTxt = relSteps.length
    ? `（第 ${relSteps.join(" 和第 ")} 步各出球一次，共 ${relSteps.length} 次）`
    : "（⚠️ 没有出球点！）";
  txt(g, `— 实线 = 进场 + 两次动作：找球→出球 ${relTxt}`,
      F2X(0.05), F2Y(0) + 34, "#34343a", 11);
  txt(g, `— 虚线 = 第 ${relSteps.length ? relSteps[relSteps.length - 1] : "?"} 步之后回位；橙色 = 自定义途经点`,
      F2X(0.05), F2Y(0) + 50, "#a0a09a", 11);
}
function arcPath(c, r, a0, a1) {
  const p0 = [c[0] + r * Math.cos(a0 * Math.PI / 180), c[1] + r * Math.sin(a0 * Math.PI / 180)];
  const p1 = [c[0] + r * Math.cos(a1 * Math.PI / 180), c[1] + r * Math.sin(a1 * Math.PI / 180)];
  const large = Math.abs(a1 - a0) > 180 ? 1 : 0;
  return `M${F2X(p0[0])},${G2Y(p0[1])} A${r * PX},${r * PX} 0 ${large} 0 ${F2X(p1[0])},${G2Y(p1[1])}`;
}

/* ═══════════════════════════════════════════════════════════════════
   悬停解释气泡
   ═══════════════════════════════════════════════════════════════════ */
const tipEl = document.getElementById("tip");
let tipTimer = null, tipEv = null;

function tipMoveTo(ev) {
  const pad = 15;
  const r = tipEl.getBoundingClientRect();
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 10) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 10) y = ev.clientY - r.height - pad;
  tipEl.style.left = Math.max(6, x) + "px";
  tipEl.style.top = Math.max(6, y) + "px";
}

/* 鼠标停在点上 0.4 秒后弹出 */
function tipArm(ev, title, text) {
  clearTimeout(tipTimer);
  tipEv = ev;
  if (!text) return;
  tipTimer = setTimeout(() => {
    tipEl.innerHTML = `<b>${title}</b><span class="tipbody">${text || ""}</span>`;
    tipEl.classList.add("on");
    if (tipEv) tipMoveTo(tipEv);
  }, 400);
}
function tipHide() {
  clearTimeout(tipTimer);
  tipEl.classList.remove("on");
}
/* 数值行上的提示：鼠标停下也弹（用行本身当锚点） */
function tipArmAt(el, title, text) {
  el.addEventListener("pointerenter", ev => tipArm(ev, title, text));
  el.addEventListener("pointermove", ev => { if (tipEl.classList.contains("on")) tipMoveTo(ev); });
  el.addEventListener("pointerleave", tipHide);
}

/* ═══════════════════════════════════════════════════════════════════
   拖动
   ═══════════════════════════════════════════════════════════════════ */
let drag = null;
function startDrag(ev, h) {
  ev.preventDefault();
  drag = h;
  const svgPt = toSvg(ev);
  h._off = [F2X(h.get()[0]) - svgPt.x, G2Y(h.get()[1]) - svgPt.y];
  /* 正交约束用：记住按下时这个点的原始位置 */
  const p0 = h.get();
  h._origin = [p0[0], p0[1]];
  /* 撤回用：按下时先记下拖动【之前】的状态，
     松手时如果真动过才入栈 → 一次拖动 = 一步撤回 */
  h._before = JSON.stringify(S);
  h._moved = false;
  svg.setPointerCapture ? svg.setPointerCapture(ev.pointerId) : null;
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", endDrag, { once: true });
}
function toSvg(ev) {
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const sx = vb.width / r.width, sy = vb.height / r.height;
  return { x: (ev.clientX - r.left) * sx, y: (ev.clientY - r.top) * sy };
}
function onMove(ev) {
  if (!drag) return;
  const p = toSvg(ev);
  let x = X2F(p.x + (drag._off ? drag._off[0] : 0));
  let y = Y2F(p.y + (drag._off ? drag._off[1] : 0));

  /* ── 正交约束 ─────────────────────────────────────────────────
     把位移锁成"纯水平"或"纯垂直"：取位移大的那个轴，另一个轴保持原值。
     开关打开时生效，或按住 Shift 临时生效。 */
  const wantOrtho = ortho || ev.shiftKey;
  if (wantOrtho && drag._origin) {
    const o = drag._origin;
    if (Math.abs(x - o[0]) >= Math.abs(y - o[1])) y = o[1];
    else x = o[0];
  }

  if (snap) { x = Math.round(x / 0.05) * 0.05; y = Math.round(y / 0.05) * 0.05; }
  x = r2(clamp(x, -3, FL + 3));
  y = r2(clamp(y, -2, Y_TOP + 0.3));
  drag.set(x, y);
  drag._moved = true;
  draw();
}
function endDrag() {
  /* 只有真拖动过才记一步（单纯点一下不入栈） */
  if (drag && drag._moved && drag._before) pushHistory(drag._before);
  drag = null;
  window.removeEventListener("pointermove", onMove);
}

/* ═══════════════════════════════════════════════════════════════════
   阻碍线检查 —— 半场置球区是 X=5.75 的一条【竖线】(Y≈0.75~6.75)
   ═══════════════════════════════════════════════════════════════════
   2025 规则 §6-2：半场置球区（绿线）= 传球边界线与三分线之间。
   repo 解读（docs/18）：X=5.75，Y≈[0.75, 6.75]。
   第 2/3 回合这条线上有 4 个【干扰球】(用球表 0/4) —— 撞一次扣 2 分。

   所以从场地左侧(x<5.75)去右侧(x>5.75)，必须从【竖线上端】绕过去，
   也就是先升到 Y=6.8（进场点 / 上侧通道 的 Y 都是 6.8）再横穿。
   ⚠️ 上端余量只有 6.8−6.75 = 0.05 m，车体一定会压到线顶那颗球 ——
      4 颗球到底摆在 Y 的哪几个高度，必须现场量。
*/
const HALF_LINE_X = 5.75;
const HALF_LINE_TOP_Y = 6.75;

function segCrossY(a, b, X) {
  if ((a[0] - X) * (b[0] - X) > 0) return null;    // 不跨越
  if (Math.abs(b[0] - a[0]) < 1e-9) return null;
  const k = (X - a[0]) / (b[0] - a[0]);
  if (k < 0 || k > 1) return null;
  return a[1] + k * (b[1] - a[1]);
}

/* 返回本轮所有"过阻碍线"的位置，标注是否够高 */
function crossingReport(r, tk) {
  const seq = routeSeq(r, tk || task).map(e => e.pt);
  const out = [];
  for (let i = 0; i < seq.length - 1; i++) {
    const y = segCrossY(seq[i], seq[i + 1], HALF_LINE_X);
    if (y === null) continue;
    out.push({
      from: seq[i], to: seq[i + 1], y: r2(y),
      clear: r2(y - HALF_LINE_TOP_Y),
      ok: y >= HALF_LINE_TOP_Y - 0.001
    });
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════════════
   半场检查 —— 整车（不只是车心）不许进对方半场
   ═══════════════════════════════════════════════════════════════════
   我们的半场 = y ≥ 3.75（上场半场；出发区 A 在上边线之外）。
   车不是质点：展开 1.20×1.00，还要留定位余量 0.10 m。
     · 车头沿 y → 沿 y 占 长/2 + 余量 = 0.70 ⇒ 车心最低 y = 4.45
     · 车头沿 x → 沿 y 占 宽/2 + 余量 = 0.60 ⇒ 车心最低 y = 4.35
   统一用 4.35 当警告线（比按最保守朝向算的 4.45 略松一点）。
*/
const HALF_Y = 3.75;
const HALF_NEED_Y = 4.35;

function halfReport(r, tk) {
  const seq = routeSeq(r, tk || task).map(e => e.pt);
  const ys = seq.map(p => p[1]);
  const minY = ys.length ? Math.min(...ys) : Infinity;
  const bad = seq.filter(p => p[1] < HALF_NEED_Y - 1e-9);
  /* 线段也要看：直线段的 y 是线性的，两端够就整段够 */
  const badSeg = [];
  for (let i = 0; i < seq.length - 1; i++) {
    const m = Math.min(seq[i][1], seq[i + 1][1]);
    if (m < HALF_NEED_Y - 1e-9 && m >= HALF_Y - 1e-9) badSeg.push([seq[i], seq[i + 1]]);
  }
  return { minY: isFinite(minY) ? r2(minY) : null, need: HALF_NEED_Y,
           bad, badSeg, ok: bad.length === 0 };
}

/* ═══════════════════════════════════════════════════════════════════
   时间预算 —— 每条路线能不能在回合时限内开完
   ═══════════════════════════════════════════════════════════════════
   时限依据：2026 规则 §9「每回合准备 60/120 秒」；
             2025 用时一览表「第一回合 90 秒，第二/三回合 120 秒」。
   ⚠️ 这里算的是【纯行驶】= 路径长 ÷ 速度上限，不含：
        停车/转向、找球扫描、铲球、放球/出球、避障绕行、定位纠偏。
      真实耗时一定更长，所以留 30% 余量才算安全。
*/
const ROUND_LIMIT_S = { 1: 90, 2: 120, 3: 120 };

function routeStats(r, tk) {
  const seq = routeSeq(r, tk || task).map(e => e.pt);
  let len = 0;
  for (let i = 0; i < seq.length - 1; i++)
    len += Math.hypot(seq[i + 1][0] - seq[i][0], seq[i + 1][1] - seq[i][1]);
  const spd = Math.max(0.05, Number(S.match.speed_mps) || 0.25);
  const t = len / spd;
  const lim = ROUND_LIMIT_S[r] || 120;
  /* 想让「纯行驶」只占时限 70%（留 30% 给停车/找球/铲球/出球），
     当前路线至少需要多快的速度 */
  const need = len / (lim * 0.7);
  return { len, t, lim, over: t - lim, safe: t <= lim * 0.7,
           need, spd, nPts: seq.length };
}

/* ═══════════════════════════════════════════════════════════════════
   走法顺序编辑器（右面板最上面那个列表）
   ═══════════════════════════════════════════════════════════════════
   比在地图上连线直观：直接看到第几步去哪，▲▼ 改顺序，✕ 删途经点。
   功能性节点不能删（规则要求每轮必须有 2 次出球等），所以那些行没有 ✕。
*/
function stepName(tok, occ) {
  if (isAreaTok(tok)) {
    const a = tok.slice(1);
    const nm = a === "middle" ? "中线" : a === "arc" ? "弧线" : "深场";
    return `搜 ${nm}（${areaPoints(a).length} 个扫描点）`;
  }
  if (isWaypoint(tok)) return `途经点 (${fmt(tok[0])}, ${fmt(tok[1])})`;
  const base = NODE_LABEL[tok] || tok;
  /* 出球点会出现两次，标上一二 */
  if ((tok === "passPt" || tok === "shootPt") && occ > 0)
    return base + (occ === 1 ? " ①" : occ === 2 ? " ②" : ` ${occ}`);
  return base;
}
function stepColor(tok, layer) {
  if (isAreaTok(tok)) return COL[tok.slice(1)] || "#888";
  if (isWaypoint(tok)) return COL.wp;
  if (tok === "passPt" || tok === "shootPt") return COL.release;
  return COL.base;
}
/* 这个 token 在列表里第几次出现（给 ①② 用） */
function occOf(list, i) {
  const tok = list[i];
  if (tok !== "passPt" && tok !== "shootPt") return 0;
  let n = 0;
  for (let j = 0; j <= i; j++) if (list[j] === tok) n++;
  return n;
}

function renderRouteEditor() {
  const host = document.getElementById("rte");
  if (!host) return;
  if (round === "all") {
    host.innerHTML = `<div class="rh"><b>走法顺序</b></div>
      <div class="hint2">「全部」是总览，不能编辑走法。<br>
      请先在上面选一个<b>具体轮次</b>（第 1 / 2 / 3 轮）。</div>`;
    return;
  }
  const list = routeList(task, round);
  const tname = task === "pass" ? "传球" : "投篮";
  let h = `<div class="rh"><b>走法顺序 · ${tname} · 第 ${round} 轮</b>
    <button onclick="stepAddAfter(-1)" title="在第一步之前插一个途经点">＋ 插到最前</button>
    <button onclick="stepAddAfter(${list.length - 1})" title="在最后一步之后插一个途经点">＋ 加到最后</button>
    <button onclick="toggleLink()" title="也可以在地图上依次点各个点重排">⇢ 图上连线</button>
  </div><div class="rl">`;

  list.forEach((tok, i) => {
    const isWp = isWaypoint(tok);
    const nm = stepName(tok, occOf(list, i));
    const col = stepColor(tok);
    const sel = (selId && tokIndexOf(selId) === i) ? " sel" : "";
    h += `<div class="st${sel}" onclick="stepSel(${i})" title="点一下选中：加点会插在它后面">` +
      `<span class="n">${i + 1}</span>` +
      `<span class="nm"><i style="background:${col}"></i>${nm}</span>` +
      `<span class="ops">` +
        `<button onclick="event.stopPropagation();stepMove(${i},-1)" ${i === 0 ? "disabled" : ""} title="上移">▲</button>` +
        `<button onclick="event.stopPropagation();stepMove(${i},1)" ${i === list.length - 1 ? "disabled" : ""} title="下移">▼</button>` +
        `<button onclick="event.stopPropagation();stepAddAfter(${i})" title="在它后面插一个途经点">＋</button>` +
        (isWp ? `<button class="del" onclick="event.stopPropagation();stepDel(${i})" title="删掉这个途经点">✕</button>`
              : `<button disabled title="功能性节点不能删（规则要求，比如每轮必须 2 次出球）">✕</button>`) +
      `</span></div>`;
  });

  /* 路线编辑框下面不再显示任何警告。
     原来这里有四类：① 出球点次数 ② 过阻碍线 ③ 半场检查 ④ 时间预算。
     ② 那一段判据用的是写死的 6.8（通道已经改成 6.05），算出来是错的；
     其余三类在现场也偏吵，所以整块去掉。
     三个计算函数 crossingReport / halfReport / routeStats 保留着，
     想恢复只要把 warn 那几段拼回来。 */

  h += `</div><div class="hint2">` +
    `▲▼ 改顺序；<b>＋</b> 在该步后插途经点；<b>✕</b> 删（只有橙色途经点能删）。<br>` +
    `点某一行＝选中它，然后用顶部「＋ 加点」在地图上点位置。</div>`;
  host.innerHTML = h;
}

/* 选中某一行的 token */
function stepSel(i) {
  const list = routeList(task, round);
  const tok = list[i];
  if (isWaypoint(tok)) selId = "wp" + i;
  else if (isAreaTok(tok)) {
    const a = tok.slice(1);
    selId = a === "middle" ? "midR" : a === "arc" ? "arcP0" : "innT";
  } else selId = tok;
  draw();
}

/* 上移 / 下移一步 */
function stepMove(i, dir) {
  const list = routeList(task, round);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  pushHistory();
  const t = list[i]; list[i] = list[j]; list[j] = t;
  selId = null;
  draw();
}

/* 删掉某一行的途经点（功能性节点拒绝） */
function stepDel(i) {
  const list = routeList(task, round);
  if (!isWaypoint(list[i])) {
    alert("这是功能性节点，不能删。\n只有橙色的【自定义途经点】可以删。");
    return;
  }
  pushHistory();
  list.splice(i, 1);
  selId = null;
  draw();
}

/* 在第 i 步后面插一个途经点；i = -1 表示插到最前面 */
function stepAddAfter(i) {
  if (round === "all") return;
  const list = routeList(task, round);
  /* 新点默认放在"它和下一步"的中间，位置一眼能看见 */
  const pA = i >= 0 ? tokenOrWpPoint(list[i]) : tokenOrWpPoint(list[0] || "start");
  const pB = tokenOrWpPoint(list[i + 1] || list[list.length - 1] || "start");
  let nx, ny;
  if (pA && pB) { nx = r2((pA[0] + pB[0]) / 2); ny = r2((pA[1] + pB[1]) / 2); }
  else if (pA) { nx = r2(pA[0] + 0.5); ny = r2(pA[1] + 0.5); }
  else { nx = 3.0; ny = 5.0; }
  pushHistory();
  list.splice(i + 1, 0, [nx, ny]);
  selId = "wp" + (i + 1);
  draw();
}
function tokenOrWpPoint(tok) {
  if (tok == null) return null;
  if (isWaypoint(tok)) return tok;
  if (isAreaTok(tok)) { const p = areaPoints(tok.slice(1)); return p[0] || null; }
  return tokenPoint(tok);
}

/* ═══════════════════════════════════════════════════════════════════
   加点 / 删点 / 连线
   ═══════════════════════════════════════════════════════════════════
   规矩（按现场要求）：
     · 功能性节点（出发点/进场点/通道/传球点/投篮点/各搜索区域）【不可删】
     · 能加能删的只有自定义【途经点】，它插在走法列表里
*/
function setModeUI() {
  const set = (id, on) => {
    const b = document.getElementById(id);
    if (b) b.classList.toggle("on", !!on);
  };
  set("btnAdd", addMode);
  set("btnLink", linkMode);
  const bl = document.getElementById("btnLink");
  if (bl) bl.textContent = linkMode
    ? `✓ 完成连线 (${linkBuf.length})`
    : "⇢ 连线";
  const svgEl = document.getElementById("svg");
  if (svgEl) svgEl.style.cursor = (addMode || linkMode) ? "crosshair" : "";
}

function toggleAdd() {
  if (round === "all") { alert("「全部」只是总览，不能编辑。请先选一个具体轮次。"); return; }
  addMode = !addMode;
  if (addMode) linkMode = false;
  setModeUI();
  draw();
}

function toggleLink() {
  if (round === "all") { alert("「全部」只是总览，不能编辑。请先选一个具体轮次。"); return; }
  if (linkMode) { linkApply(); return; }      // 已在连线模式 → 完成并应用
  linkMode = true;
  addMode = false;
  linkBuf = [];
  setModeUI();
  draw();
}

/* 选中某个点（作为"加点插在哪"的参照） */
function selectPoint(id) {
  selId = (selId === id) ? null : id;
  draw();
}

/* 找一个句柄的点在走法列表里的位置（返回 tokIndex；找不到返回 -1） */
function tokIndexOf(id) {
  const list = routeList(task, round);
  if (id.startsWith("wp")) return parseInt(id.slice(2), 10);
  for (let i = 0; i < list.length; i++) {
    const t = list[i];
    if (isAreaTok(t) && id.startsWith("arcP") && t === "@arc") return i;
    if (isNodeTok(t) && t === id) return i;
    if (isAreaTok(t) && ((id === "midR" || id === "midL") && t === "@middle")) return i;
    if (isAreaTok(t) && ((id === "innT" || id === "innB") && t === "@inner")) return i;
  }
  return -1;
}

/* 在"选中点"后面插一个途经点；没选中就插在出球点前面 */
function addWaypointAt(x, y) {
  if (round === "all") return;
  const list = routeList(task, round);
  let at = list.length;
  if (selId != null) {
    const i = tokIndexOf(selId);
    if (i >= 0) at = i + 1;
  } else {
    /* 默认插在最后一个"出球点"之前，也就是找球段末尾 */
    const j = list.findIndex(t => t === "passPt" || t === "shootPt");
    if (j >= 0) at = j;
  }
  pushHistory();
  list.splice(at, 0, [r2(x), r2(y)]);
  selId = "wp" + at;
  draw();
}

/* 删除选中的途经点（功能性节点拒绝删） */
function deleteSel() {
  if (round === "all") { alert("「全部」不能编辑。"); return; }
  if (!selId) { alert("先点一下要删的【橙色途经点】，再点删点。"); return; }
  const list = routeList(task, round);
  const i = tokIndexOf(selId);
  if (i < 0 || !isWaypoint(list[i])) {
    alert("只能删【橙色的自定义途经点】。\n出发点 / 进场点 / 通道 / 传球点 / 投篮点 / 搜索区域都是功能性节点，不能删。");
    return;
  }
  pushHistory();
  list.splice(i, 1);
  selId = null;
  draw();
}

/* 连线模式：把一个 token 追加到新顺序里 */
function linkPush(tok) {
  if (linkBuf.length && linkBuf[linkBuf.length - 1] === tok) return;
  linkBuf.push(tok);
  draw();
}

/* 应用连线结果 */
function linkApply() {
  if (!linkBuf.length) { alert("还没点任何点。"); return; }
  const hasEnd = linkBuf.some(t => t === "passPt" || t === "shootPt");
  if (!hasEnd) {
    if (!confirm("这条走法里没有【传球点/投篮点】，出球那一步会丢。仍然保存吗？")) return;
  }
  pushHistory();
  S.route[task][String(round)] = linkBuf.slice();
  linkBuf = [];
  linkMode = false;
  setModeUI();
  draw();
}

/* 连线模式：取消 */
function linkCancel() { linkBuf = []; linkMode = false; setModeUI(); draw(); }

/* 把当前（含连线的临时顺序）画出来时用的序列 */
function displaySeq() {
  return routeSeq(round, task);
}

/* 在空白处点一下 → 加点（只在加点模式生效） */
function onSvgClick(ev) {
  if (!addMode || round === "all") return;
  /* 点在句柄上时不当作"加点"（句柄自己会 stopPropagation 之外的判断） */
  if (ev.target && ev.target.closest && ev.target.closest(".hnd")) return;
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const x = X2F((ev.clientX - r.left) * (vb.width / r.width));
  const y = Y2F((ev.clientY - r.top) * (vb.height / r.height));
  addWaypointAt(clamp(x, -2, FL + 2), clamp(y, -1.5, Y_TOP));
}

/* 连线/加点模式下的快捷键 */
function onModeKey(ev) {
  if (ev.key === "Escape") {
    if (linkMode) { linkCancel(); return; }
    if (addMode) { addMode = false; setModeUI(); draw(); return; }
    if (selId) { selId = null; draw(); }
  }
  if ((ev.key === "Delete" || ev.key === "Backspace") && selId) {
    /* 别抢输入框里的退格 */
    const t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
    ev.preventDefault();
    deleteSel();
  }
}

/* ═══════════════════════════════════════════════════════════════════
   撤回（只回退【数据】，不动显示开关）
   ═══════════════════════════════════════════════════════════════════
   · 拖一次 = 一步（按下时记下拖动前的状态，松手时才入栈；
     所以"只点一下没拖动"不会占一步，也不会一次撤回只挪一个像素）
   · 数字框改一次 = 一步
   · 重置 = 一步
*/
const HISTORY = [];
const HIST_MAX = 200;

function pushHistory(stateStr) {
  HISTORY.push(stateStr !== undefined ? stateStr : JSON.stringify(S));
  if (HISTORY.length > HIST_MAX) HISTORY.shift();
  syncUndoBtn();
}

function undo() {
  if (!HISTORY.length) return;
  S = JSON.parse(HISTORY.pop());
  syncUndoBtn();
  draw();
}

function syncUndoBtn() {
  const b = document.getElementById("btnUndo");
  if (!b) return;
  b.disabled = HISTORY.length === 0;
  b.textContent = HISTORY.length ? `↶ 撤回 (${HISTORY.length})` : "↶ 撤回";
}

/* Ctrl+Z / Cmd+Z */
window.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === "z" || e.key === "Z")) {
    e.preventDefault();
    undo();
  }
});

function drawPanel() {
  const body = document.getElementById("body");
  const scroll = body.scrollTop;
  body.innerHTML = "";
  const pubSync = [];   /* 坐标行的公开帧读数，渲染完统一刷一次 */
  void pubSync;
  for (const row of ROWS) {
    if (row[0] === "grp") {
      const g = document.createElement("div");
      g.className = "grp";
      const h = document.createElement("h3");
      h.innerHTML = row[1] + `<small>${row[2]}</small>`;
      g.appendChild(h);
      body.appendChild(g);
      continue;
    }
    let k, label, layer, get, set;
    if (row[0] === "sep") {
      /* 中线的三个数值放在一行里 */
      k = row[1];
      const d = document.createElement("div");
      d.className = "row";
      d.innerHTML = `<span class="k"><i style="background:${COL.middle}"></i>
        中线 right_x / left_x / y（也拖图上的点）</span>`;
      body.appendChild(d);
      continue;
    }
    [, k, label, layer, get, set] = row;
    const d = document.createElement("div");
    d.className = "row";
    const cur = get();
    const isXY = Array.isArray(cur);
    /* y 这一格按【新帧】显示： 新.y = 旧.y − 3.75。 x / 半径 / 角度 / 时间不动。
       只有 middle.y 这个"n"行是 y 坐标，其余 n 行都不是。 */
    const isYRow = (k === "middle.y");
    const curDisp = isXY ? [cur[0], toY(cur[1])]
                        : (isYRow ? toY(cur) : cur);
    d.innerHTML =
      `<span class="k" title=""><i style="background:${COL[layer] || "#888"}"></i>${label}</span>` +
      (isXY
        ? `<input class="ix" type="number" step="0.01" value="${curDisp[0] ?? ""}">
           <input class="iy" type="number" step="0.01" value="${curDisp[1] ?? ""}">
           <span class="pub" title="第一行是给匹配的公开帧（90°旋转，只给控制台看）；导出给小车的是上面那两个框（新帧，中线=0）"></span>`
        : `<input class="iv" type="number" step="0.01" value="${curDisp ?? ""}">
           <span></span>`);
    /* 坐标行：在输入框右边再显示一份【公开帧】读数，方便和队友控制台对数 */
    d._syncPub = () => {
      const sp = d.querySelector(".pub");
      if (!sp) return;
      const a = parseFloat(d.querySelector(".ix").value);
      const b = parseFloat(d.querySelector(".iy").value);
      if (!isFinite(a) || !isFinite(b)) { sp.textContent = ""; return; }
      sp.textContent = pubText2(a, fromY(b));   // a/b 是新帧，pubText2 要旧帧
    };
    d._syncPub();          /* 初次渲染也刷一次，否则要等改动才出现 */
    /* 行的说明：鼠标停在标签上也弹同一个气泡 */
    const kEl = d.querySelector(".k");
    if (kEl && TIP_TEXT[k]) tipArmAt(kEl, label, TIP_TEXT[k]);
    /* 出球点那些行：不是当前任务的淡化掉（传球/投篮的点不一样） */
    if (k) {
      const isPassRow = k.indexOf("pass.") === 0;
      const isShootRow = k.indexOf("shoot.") === 0;
      if ((isPassRow && task !== "pass") || (isShootRow && task !== "shoot")) {
        d.style.opacity = ".42";
        d.title = "这是另一个任务（" + (isPassRow ? "传球" : "投篮") + "）的点";
      }
    }
    const inputs = d.querySelectorAll("input");
    inputs.forEach(inp => {
      inp.addEventListener("change", () => {
        const v = parseFloat(inp.value);
        if (!isFinite(v)) return;
        pushHistory();                       // ← 改之前先记一步
        if (isXY) {
          const a = parseFloat(inputs[0].value), b = parseFloat(inputs[1].value);
          set([r2(a), fromY(b)]);           // ← y 从新帧换回旧帧再存
          if (d._syncPub) d._syncPub();
        } else set(isYRow ? fromY(v) : r2(v));   // ← middle.y 同理
        draw();
      });
    });
    body.appendChild(d);
  }
  body.scrollTop = scroll;
}

/* 把与当前轮无关的图层勾选框灰掉（状态记在 LAYERS 里，切回来会恢复） */
function syncLayerBoxes() {
  for (const k of Object.keys(LAYERS)) {
    const cb = document.getElementById("ly_" + k);
    if (!cb) continue;
    const ok = applies(k);
    cb.disabled = !ok;
    cb.checked = ok && LAYERS[k];
    const lab = cb.parentElement;
    if (lab) {
      lab.style.opacity = ok ? "1" : ".4";
      lab.title = ok ? "" : "本轮不搜这个区域";
    }
  }
}

function syncTabs() {
  [...taskTabs.children].forEach(b => b.classList.toggle("on", b.dataset.task === task));
  [...tabs.children].forEach(b => b.classList.toggle("on", b.dataset.round == round));
  [...startTabs.children].forEach(b => b.classList.toggle("on", b.dataset.start === startPoint));
  const hr = document.getElementById("hintRound");
  const tname = task === "pass" ? "传球" : "投篮";
  if (round === "all") {
    hr.textContent = `全部轮次 · ${tname}：三轮各一条颜色（不互相连，因为不属于同一趟）`;
    hr.className = "pill warn";
  } else {
    const areas = activeAreas().map(a =>
      a === "middle" ? "中线" : a === "arc" ? "弧线" : "深场");
    hr.textContent = `第 ${round} 轮 · ${tname}　走法：` +
      routeList(task, round).map(tokName).join(" → ");
    hr.className = "pill";
  }
  syncLayerBoxes();
}

/* token → 给人看的名字 */
function tokName(t) {
  if (isAreaTok(t)) {
    const a = t.slice(1);
    return "@" + (a === "middle" ? "中线" : a === "arc" ? "弧线" : "深场");
  }
  if (isWaypoint(t)) return `途经(${fmt(t[0])},${fmt(t[1])})`;
  return NODE_LABEL[t] || t;
}
