/* ═══════════════════════════════════════════════════════════════════
   保存 / 打开 / 自动保存
   ═══════════════════════════════════════════════════════════════════
   「保存进度」存的是【整个编辑器状态】(S)，一个文件装下所有东西：
       match_rounds.json + mission.yaml + landmarks + 传球/投篮走法
   下次用「打开」读回来，接着编。
   ※ 导出才是"粘回仓库文件"，两件事分开，不用每次都导出。
*/
/* ⚠️ 存储键带版本号：改了默认坐标就换一个键，
   这样"上一次用旧键存的、没有 base 的老存档"不会再来捣乱。
   v2 = 最初的整体覆盖版（有 bug：会盖掉新默认值）
   v3 = 带 base 的三方合并版 */
const LS_KEY = "field_editor_state_v3";
const LS_KEY_OLD = ["field_editor_state_v2"];   /* 老键，只做备份不自动用 */

function saveState() {
  const payload = {
    _what: "场地坐标编辑器 · 进度文件",
    _when: new Date().toISOString(),
    _note: "用编辑器右下「打开」读回；这不是要粘进仓库的配置，导出才用「导出…」",
    state: S
  };
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  const name = `场地坐标进度_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}` +
               `_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  downloadText(name, JSON.stringify(payload, null, 2));
  markSaved();
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function loadState(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(String(rd.result));
      const st = o && o.state ? o.state : o;      // 兼容直接存 S 的文件
      if (!st || !st.match) throw new Error("文件里没有 match 数据");
      /* 如果打开的是仓库里那份 match_rounds.json（带 coordinate_y_offset_m），
         它是【新帧】；换回内部用的旧帧再合并。 */
      /* search_order 是从 route 推出来的，不是可编辑数据 —— 打开时丢掉，
         免得它盖住你自己画的顺序。 */
      if (st.match) delete st.match.search_order;
      if (st.match && typeof st.match.coordinate_y_offset_m === "number") {
        const off = st.match.coordinate_y_offset_m;
        shiftMatchY(st.match, -off);
        delete st.match.coordinate_y_offset_m;
        if (st.route) st.route = shiftRouteY(st.route, -off);
        if (o.base && o.base.match && typeof o.base.match.coordinate_y_offset_m === "number") {
          const bo = o.base.match.coordinate_y_offset_m;
          shiftMatchY(o.base.match, -bo); delete o.base.match.coordinate_y_offset_m;
        }
      }
      pushHistory();
      const base = o && o.base ? o.base : null;
      if (base && JSON.stringify(base) !== JSON.stringify(DEFAULTS)) {
        /* 文件是旧默认值时存的 → 三方合并，别把新版默认值盖掉 */
        const ch = {};
        collectChanges(base, st, "", ch);
        S = deepClone(DEFAULTS);
        applyChanges(S, ch);
        markSaved(`已打开：${f.name}（默认值更新过，已合并你的 ${Object.keys(ch).length} 处改动）`);
      } else if (base) {
        S = deepClone(st);
        markSaved("已打开：" + f.name);
      } else {
        /* 老文件（没存 base）：只能整体恢复，但缺的键用新默认值补 */
        S = deepClone(DEFAULTS);
        applyChanges(S, (() => { const c = {}; collectChanges({}, st, "", c); return c; })());
        markSaved(`已打开：${f.name}（旧格式文件，缺的项已用新默认值补齐）`);
      }
      round = 2; task = "pass";
      selId = null; addMode = false; linkMode = false; linkBuf = [];
      setModeUI(); syncTabs(); draw();
    } catch (e) {
      alert("这个文件读不了：\n" + e.message);
    }
    input.value = "";
  };
  rd.readAsText(f, "utf-8");
}

/* ── 三方合并：把「用户改过的」盖到「新默认值」上 ───────────────
   问题背景：编辑器更新了默认走法/坐标后，如果直接整体恢复浏览器里
   存的旧状态，新默认值就被盖掉了 —— 用户看不到任何更新。
   做法：存的时候连当时的默认值一起存；恢复时算出「用户相对旧默认值
   改了哪些叶子」，再把这份改动贴到新默认值上。
*/
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

/* 收集 base→cur 的叶子级差异，path 形如 "match.middle.left_x" */
function collectChanges(base, cur, path, out) {
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  if (Array.isArray(base) || Array.isArray(cur) || !isObj(base) || !isObj(cur)) {
    if (JSON.stringify(base) !== JSON.stringify(cur)) out[path] = deepClone(cur);
    return;
  }
  const keys = new Set([...Object.keys(base), ...Object.keys(cur)]);
  for (const k of keys)
    collectChanges(base[k], cur[k], path ? path + "." + k : k, out);
}
function applyChanges(target, out) {
  for (const p of Object.keys(out)) {
    const parts = p.split(".");
    let o = target;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!o[parts[i]] || typeof o[parts[i]] !== "object") o[parts[i]] = {};
      o = o[parts[i]];
    }
    o[parts[parts.length - 1]] = deepClone(out[p]);
  }
}

/* 自动存到浏览器本地，刷新页面不丢；连同"当时的默认值"一起存 */
function autoSave() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      v: 3, state: S, base: DEFAULTS, when: new Date().toISOString()
    }));
  } catch (e) {}
}
/* 恢复。返回 {ok, merged, kept, old}
   ⚠️ 只认 v3 格式（带 base）。老格式没有 base，无法判断"哪些是你改的"，
      硬合等于整体覆盖 → 你会看不到新默认值。所以老存档【只备份、不使用】。 */
function autoRestore() {
  try {
    const t = localStorage.getItem(LS_KEY);
    if (!t) return { ok: false, merged: false };
    const p = JSON.parse(t);
    /* 没有 base 的存档：不自动应用，只留个备份，用新默认值 */
    if (!p || !p.state || !p.state.match || !p.base) {
      try { localStorage.setItem(LS_KEY + "_orphan", t); } catch (e) {}
      return { ok: false, orphan: true };
    }
    if (JSON.stringify(p.base) === JSON.stringify(DEFAULTS)) {
      S = deepClone(p.state);                  /* 默认值没变 → 整体恢复 */
      return { ok: true, merged: false };
    }
    /* 默认值变了 → 三方合并：你改过的保留，我的新默认值生效 */
    const ch = {};
    collectChanges(p.base, p.state, "", ch);
    S = deepClone(DEFAULTS);
    applyChanges(S, ch);
    return { ok: true, merged: true, kept: Object.keys(ch).length };
  } catch (e) { return { ok: false, merged: false }; }
}
function clearAutoSave() {
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
}

/* 拖动时 draw() 会被调很多次，写本地要防抖，别每次都写 */
let _saveT = null;
function scheduleSave() {
  if (_saveT) clearTimeout(_saveT);
  _saveT = setTimeout(() => { autoSave(); refreshSaveInfo(); }, 250);
}

/* 底部那行小字：告诉你【到底有哪些文件真的改了】 */
function markSaved(msg) {
  const el = document.getElementById("saveInfo");
  if (!el) return;
  if (msg) { el.dataset.msg = msg; }
  refreshSaveInfo();
}

function refreshSaveInfo() {
  const el = document.getElementById("saveInfo");
  if (!el) return;
  const t = hiddenTargets();          // 看哪些目标跟原始值不一样了
  const msg = el.dataset.msg ? `<b>${el.dataset.msg}</b><br>` : "";
  if (!t.length) {
    el.innerHTML = msg +
      `还没改任何东西 —— 现在<b>不需要覆盖任何文件</b>。` +
      `要改就去图上拖点；想留个底就点 <b>💾 保存进度</b>。`;
    return;
  }
  el.innerHTML = msg +
    `改动落在 <b>${t.length}</b> 个文件上，只有这几个需要覆盖：` +
    `<span class="chg">${t.map(x => x.file).join("　")}</span><br>` +
    `点 <b>导出…</b> 取出对应的那一段就行，没列出来的**不用动**。`;
}

/* 哪些导出目标跟仓库原始值不一样了 */
function hiddenTargets() {
  const out = [];
  const orig = DEFAULTS;
  const saved = S;
  try {
    S = JSON.parse(JSON.stringify(orig));
    const oJson = exportMatch(), oYaml = exportYaml(), oLm = exportLm();
    S = saved;
    if (exportMatch() !== oJson) out.push({ k: "json", file: "match_rounds.json" });
    if (exportYaml() !== oYaml)  out.push({ k: "yaml", file: "mission.yaml" });
    if (exportLm()   !== oLm)    out.push({ k: "lm",   file: "localization.yaml" });
  } catch (e) { S = saved; }
  return out;
}

/* ── 导出下拉 ─────────────────────────────────────────────── */
function toggleDD(ev) {
  if (ev) ev.stopPropagation();
  const m = document.getElementById("ddmenu");
  const open = m.classList.toggle("open");
  if (open) buildDD();
}
function buildDD() {
  const m = document.getElementById("ddmenu");
  const changed = hiddenTargets();
  const isChg = k => changed.some(c => c.k === k);
  const items = [
    ["json", "match_rounds.json", "路线 / 速度 / 出球点 / 走法", isChg("json")],
    ["yaml", "mission.yaml", "场地几何：篮筐、三分线、传球区…", isChg("yaml")],
    ["lm",   "localization.yaml", "定位柱坐标", isChg("lm")],
  ];
  let h = "";
  for (const [k, name, desc, chg] of items) {
    h += `<button onclick="showExport('${k}');closeDD()">` +
         `<span class="t">${chg ? "● " : "　"}${name}</span>` +
         `<span class="d">${desc}${chg ? " —— 已改动" : "（跟原值一样）"}</span></button>`;
  }
  h += `<hr><button onclick="showExport('py');closeDD()">` +
       `<span class="t">　Python 片段</span>` +
       `<span class="d">只是核对/写文档用，不用粘回仓库</span></button>`;
  m.innerHTML = h;
  const badge = document.getElementById("ddBadge");
  badge.textContent = changed.length ? `(${changed.length})` : "";
  badge.className = changed.length ? "some" : "";
}
function closeDD() { document.getElementById("ddmenu").classList.remove("open"); }
document.addEventListener("click", () => closeDD());

/* ═══════════════════════════════════════════════════════════════════
   导出
   ═══════════════════════════════════════════════════════════════════ */
const dlg = document.getElementById("dlg");
const dout = document.getElementById("dout");

function jnum(v) { return typeof v === "number" ? r2(v) : v; }

/* 递归把所有数字四舍五入到 3 位小数，不动结构 ——
   这样导出等于"原文件 + 被改过的值"，不会漏掉任何键。 */
function roundDeep(o) {
  if (Array.isArray(o)) return o.map(roundDeep);
  if (o && typeof o === "object") {
    const r = {};
    for (const k of Object.keys(o)) r[k] = roundDeep(o[k]);
    return r;
  }
  return typeof o === "number" ? r2(o) : o;
}

/* 把 match 配置里所有 y 坐标平移 dy（新 = 旧 + dy）。
   ⚠️ 只动【坐标】，不动半径/角度/速度/时间。 */
function shiftMatchY(o, dy) {
  const P = a => { if (Array.isArray(a) && a.length === 2 && typeof a[1] === "number")
                     a[1] = r2(a[1] + dy); return a; };
  P(o.start); P(o.entry); P(o.corridor);
  if (o.middle) o.middle.y = r2(o.middle.y + dy);
  if (o.arc && Array.isArray(o.arc.center)) o.arc.center[1] = r2(o.arc.center[1] + dy);
  if (o.inner) { o.inner.top_y = r2(o.inner.top_y + dy);
                 o.inner.bottom_y = r2(o.inner.bottom_y + dy); }
  if (o.release) for (const tk of Object.keys(o.release)) {
    const a = o.release[tk]; if (a && a.point) P(a.point); if (a && a.aim) P(a.aim);
  }
  if (o.pass_ring && typeof o.pass_ring.y === "number") o.pass_ring.y = r2(o.pass_ring.y + dy);
  if (o.pass_ring && Array.isArray(o.pass_ring.point)) P(o.pass_ring.point);
  return o;
}

/* 走法列表里的 [x,y] 途经点也要跟着平移 */
function shiftRouteY(route, dy) {
  const go = v => {
    if (Array.isArray(v)) { if (v.length === 2 && typeof v[1] === "number") return [v[0], r2(v[1] + dy)]; return v; }
    if (v && typeof v === "object") { const o = {}; for (const k in v) o[k] = go(v[k]); return o; }
    return v;
  };
  return go(route);
}

function exportMatch() {
  /* 导出的就是【新帧】（coordinate_y_offset_m = −3.75），可以直接丢给小车跑。
     内部模型仍是旧帧（图纸不变），这里平移出去。 */
  const o = shiftMatchY(roundDeep(S.match), Y0);
  /* 搜索顺序也从你画的 route 导出 —— 代码 search_order() 读的就是它。
     activeAreasOf() 按 route 里 @区域 出现的先后去重，就是找球顺序。 */
  o.search_order = {};
  for (const tk of ["pass", "shoot"]) {
    o.search_order[tk] = {};
    for (const r of [1, 2, 3]) o.search_order[tk][String(r)] = areasByStageOf(r, tk);
  }
  o.coordinate_y_offset_m = r2(Y0);
  /* 路线（走法）也一起导出：传球/投篮 × 三轮，元素是节点名或 [x,y] 途经点。
     现有代码不认识 route 键会直接忽略，不影响解析。 */
  o.route = shiftRouteY(roundDeep(S.route), Y0);
  return JSON.stringify(o, null, 2);
}

function exportYaml() {
  const F = S.mission;
  const n = v => { const s = r2(v).toString(); return s.includes(".") ? s : s + ".0"; };
  const L = [];
  L.push("# src/rb_mission/config/mission.yaml → field:");
  L.push(`  length_m: ${n(F.length_m)}`);
  L.push(`  width_m: ${n(F.width_m)}`);
  L.push("");
  L.push(`  hoop: {x: ${n(F.hoop[0])}, y: ${n(F.hoop[1])}}`);
  L.push("");
  L.push(`  front_zone_circle:`);
  L.push(`    name: "中线置球区"`);
  L.push(`    x: ${n(F.front_zone_circle.x)}`);
  L.push(`    y: ${n(F.front_zone_circle.y)}`);
  L.push(`    radius_m: ${n(F.front_zone_circle.radius_m)}`);
  L.push(`  shoot_line_radius_m: ${n(F.shoot_line_radius_m)}`);
  L.push("");
  L.push(`  three_point_radius_m: ${n(F.three_point_radius_m)}`);
  L.push(`  three_point_center: {x: ${n(F.three_point_center[0])}, y: ${n(F.three_point_center[1])}}`);
  L.push("");
  L.push(`  pass_zone:`);
  L.push(`    polygon:`);
  for (const p of F.pass_zone) L.push(`      - [${n(p[0])}, ${n(p[1])}]`);
  L.push("");
  L.push(`  shoot_zone_target: {x: ${n(F.shoot_zone_target[0])}, y: ${n(F.shoot_zone_target[1])}}`);
  L.push(`  shoot_zone_target_30: {x: ${n(F.shoot_zone_target_30[0])}, y: ${n(F.shoot_zone_target_30[1])}}`);
  L.push(`  pass_zone_target: {x: ${n(F.pass_zone_target[0])}, y: ${n(F.pass_zone_target[1])}}`);
  L.push("");
  L.push(`  start_zone_size_m: ${n(F.start_zone_size_m)}`);
  L.push(`  start_zone_offset_m: ${n(F.start_zone_offset_m)}`);
  L.push(`  start_zones:`);
  L.push(`    A: {x: ${n(F.start_zones.A[0])}, y: ${n(F.start_zones.A[1])}}`);
  L.push(`    B: {x: ${n(F.start_zones.B[0])}, y: ${n(F.start_zones.B[1])}}`);
  L.push(`  home: {x: ${n(F.home[0])}, y: ${n(F.home[1])}}`);
  return L.join("\n");
}

function exportLm() {
  const L = ["# src/rb_localization/config/localization.yaml → landmarks:"];
  if (!S.landmarks || !Object.keys(S.landmarks).length) {
    L.push("# （空）jituo/main 已删除该段：定位柱不再参与位姿修正。");
    L.push("# 仍保留 match.pillar_alignment 作出球前的视觉微调。");
    return L.join("\n");
  }
  for (const [name, lm] of Object.entries(S.landmarks)) {
    L.push(`  - name: ${name}`);
    L.push(`    enabled: ${lm.enabled}`);
    L.push(`    x: ${r2(lm.x)}`);
    L.push(`    y: ${r2(lm.y)}`);
    L.push("");
  }
  return L.join("\n");
}

function exportPy() {
  const M = S.match;
  const pts = arcPoints();
  const L = [];
  L.push("# 由场地坐标编辑器导出 —— 供核对 / 写文档用");
  L.push("PASS_SEARCH_ORDER = {");
  for (let r = 1; r <= 3; r++)
    L.push(`    ${r}: ${JSON.stringify(activeAreasOf(r, task))},`);
  L.push("}");
  L.push("");
  L.push(`# 传球点  ${JSON.stringify(M.release.pass.point)}  朝向 ${M.release.pass.search_heading_deg} 度`);
  L.push(`# 投篮点  ${JSON.stringify(M.release.shoot.point)}  瞄准 ${JSON.stringify(M.release.shoot.aim)}`);
  L.push("");
  L.push("# 各区域扫描点");
  for (const [name, pts2] of [
    ["middle", [[M.middle.right_x, M.middle.y], [M.middle.left_x, M.middle.y]]],
    ["arc", pts],
    ["inner", [[M.inner.x, M.inner.top_y], [M.inner.x, M.inner.bottom_y]]],
  ]) {
    L.push(`${name} = [`);
    for (const p of pts2) L.push(`    (${r2(p[0])}, ${r2(p[1])}),`);
    L.push("]");
    L.push("");
  }
  return L.join("\n");
}

function showExport(kind) {
  const map = {
    json: ["tools/match_rounds.json（整份替换）", exportMatch()],
    yaml: ["mission.yaml → field:（替换该段）", exportYaml()],
    lm:   ["localization.yaml → landmarks:（替换该段）", exportLm()],
    py:   ["Python 片段（核对用）", exportPy()],
  }[kind];
  document.getElementById("dtitle").textContent = map[0];
  dout.value = map[1];
  dlg.showModal();
}
function copyOut() {
  dout.select();
  navigator.clipboard.writeText(dout.value).then(
    () => { document.getElementById("dtitle").textContent = "已复制 ✓"; },
    () => { document.execCommand("copy"); }
  );
}
function resetAll() {
  if (!confirm("恢复成仓库原始值？\n（未保存的改动会丢；点完还能用「撤回」找回来）")) return;
  pushHistory();                             // ← 重置也能撤回
  S = JSON.parse(JSON.stringify(DEFAULTS));
  round = 2; task = "pass";
  selId = null; addMode = false; linkMode = false; linkBuf = [];
  clearAutoSave();
  setModeUI();
  syncTabs();
  draw();
  markSaved("已重置成仓库原始值");
}

/* 启动 */
/* 地址栏可以带初始轮次：#r1 / #r2 / #r3 / #all（方便存书签）
   也可以 #tip=<键名> 直接把某条解释显示出来（看样式 / 截图用） */
let bootTip = null;
try {
  const hash = (typeof location !== "undefined" && location.hash) || "";
  const m = /#(?:r)?(1|2|3|all)/.exec(hash);
  if (m) round = m[1] === "all" ? "all" : parseInt(m[1], 10);
  const mtk = /task=(pass|shoot)/.exec(hash);
  if (mtk) task = mtk[1];
  const mt = /[#&?]tip=([A-Za-z_][\w.]*)/.exec(hash);
  if (mt) bootTip = mt[1];
} catch (e) { /* 无 location 时忽略 */ }
syncTabs();
syncUndoBtn();
/* ⚠️ 顺序要紧：必须先 autoRestore() 再 draw()。
   因为 draw() 末尾会 scheduleSave()（自动保存），
   若先 draw 就可能把"上一次的进度"直接覆盖掉。 */
const _rest = autoRestore();
draw();
if (_rest.ok && _rest.merged)
  markSaved(`编辑器默认值更新过 —— 已把你的 ${_rest.kept} 处改动<b>合并</b>到新默认值上`);
else if (_rest.ok)
  markSaved("已自动恢复上次的编辑进度（存在浏览器本地）");
else
  markSaved();
if (bootTip && typeof TIP_TEXT !== "undefined" && TIP_TEXT[bootTip]) {
  const el = document.getElementById("tip");
  el.innerHTML = `<b>演示：${bootTip}</b>${TIP_TEXT[bootTip]}`;
  el.classList.add("on");
  el.style.left = "560px";
  el.style.top = "170px";
}
window.addEventListener("resize", () => draw());
