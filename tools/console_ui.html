<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboCup · 传球控制</title>
<style>
:root{color-scheme:dark;--bg:#14161a;--panel:#1c2027;--panel2:#232833;--line:#2e3542;--tx:#e6e9ef;--dim:#929bab;--blue:#4a9eff;--orange:#ff9b59;--ok:#3ddc84;--bad:#ff8178}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
main{max-width:1200px;margin:0 auto;padding:32px 36px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}h1{font-size:28px;margin:0;font-weight:650}.subtitle{color:var(--dim);margin:6px 0 0;font-size:14px}.tag{color:var(--dim);font-size:13px;border:1px solid var(--line);border-radius:20px;padding:6px 12px;white-space:nowrap}
.courts{display:grid;grid-template-columns:1fr 1fr;gap:24px}.court{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}h2{margin:0 0 18px;font-size:21px;display:flex;align-items:center;gap:10px}.mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#1c3454;color:var(--blue)}.b .mark{background:#432d21;color:var(--orange)}
button{display:flex;align-items:center;justify-content:space-between;width:100%;padding:22px 24px;margin-top:12px;border:1px solid #35547c;border-radius:11px;background:#1c2e49;color:var(--tx);font:600 20px/1.5 inherit;text-align:left;cursor:pointer;touch-action:manipulation;min-height:88px}button span{font-size:20px;font-weight:600}button i{font-style:normal;font-size:22px;color:var(--blue)}button:hover{background:#254064;border-color:var(--blue)}button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:active{transform:scale(.99)}.b button{background:#3b2b22;border-color:#745137}.b button i{color:var(--orange)}.b button:hover{background:#523823;border-color:var(--orange)}
.result{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.result-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line)}#status{font-size:15px}#connection{font-size:12px;color:var(--dim)}#status[data-state=succeeded]{color:var(--ok)}#status[data-state=failed]{color:var(--bad)}#status[data-state=running]{color:var(--blue)}pre{margin:0;padding:16px 20px;min-height:140px;height:22vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#b8c7d9;background:#101216}
@media(max-width:700px){main{padding:20px 16px}.courts{gap:12px}.court{padding:14px}header{align-items:flex-start}h1{font-size:23px}button{padding:18px 12px;min-height:82px}button span{font-size:16px}.tag{display:none}.result-head{padding:12px}pre{padding:12px}}
</style>
</head>
<body>
<main>
<header><div><h1>传球控制</h1><p class="subtitle">选择场地与回合，执行完整传球流程</p></div><span class="tag">按脚本配置执行</span></header>
<div class="courts">
<section class="court"><h2><span class="mark">A</span>A 场地</h2>
<button type="button" data-side="A" data-round="1"><span>A 场地 · 回合 1</span><i aria-hidden="true">↗</i></button>
<button type="button" data-side="A" data-round="2"><span>A 场地 · 回合 2</span><i aria-hidden="true">↗</i></button>
<button type="button" data-side="A" data-round="3"><span>A 场地 · 回合 3</span><i aria-hidden="true">↗</i></button>
</section>
<section class="court b"><h2><span class="mark">B</span>B 场地</h2>
<button type="button" data-side="B" data-round="1"><span>B 场地 · 回合 1</span><i aria-hidden="true">↗</i></button>
<button type="button" data-side="B" data-round="2"><span>B 场地 · 回合 2</span><i aria-hidden="true">↗</i></button>
<button type="button" data-side="B" data-round="3"><span>B 场地 · 回合 3</span><i aria-hidden="true">↗</i></button>
</section>
</div>
<section class="result" aria-label="执行结果"><div class="result-head"><span id="status" role="status">待执行</span><span id="connection">正在连接</span></div><pre id="logs" aria-label="脚本输出">请选择场地与回合。</pre></section>
</main>
<script>
const statusEl=document.getElementById('status'), logs=document.getElementById('logs'), connection=document.getElementById('connection');
let selected=null,cursor=0,polling=false;
function render(data){
  if(data.status==='idle'){
    if(data.boot){statusEl.dataset.state='idle';statusEl.textContent=data.boot.message;
      logs.textContent=data.boot.lines.join('\n')||'请选择场地与回合。';}
    return;
  }
  if(data.id!==selected){selected=data.id;cursor=0;logs.textContent='';}
  const nearBottom=logs.scrollHeight-logs.scrollTop-logs.clientHeight<60;
  const clean=data.lines.map(line=>line.replace(/\x1b\[[0-?]*[ -\/]*[@-~]/g,''));
  if(clean.length)logs.textContent+=(logs.textContent?'\n':'')+clean.join('\n');
  if(nearBottom)logs.scrollTop=logs.scrollHeight;
  cursor=data.cursor;
  const label=`${data.side} 场地 · 回合 ${data.round}`;
  statusEl.dataset.state=data.status;
  statusEl.textContent=data.status==='running'?`${label} · 执行中`:data.status==='succeeded'?`${label} · 执行完成（退出码 0）`:`${label} · 执行失败（退出码 ${data.returncode}）`;
}
async function poll(){
  if(polling)return;polling=true;
  const requestId=selected;
  try{
    const params=selected?`?id=${encodeURIComponent(selected)}&after=${cursor}`:'';
    const response=await fetch('/api/pass/state'+params,{cache:'no-store'});
    const data=await response.json();
    if(response.status===404 && requestId===selected){selected=null;cursor=0;localStorage.removeItem('robocup-pass-run');return;}
    if(!response.ok)throw new Error(data.error);
    if(requestId===selected)render(data);
    connection.textContent='已连接';
  }catch(error){connection.textContent='连接中断，正在重连';}
  finally{polling=false;}
}
for(const button of document.querySelectorAll('button'))button.addEventListener('click',async()=>{
  const side=button.dataset.side,round=Number(button.dataset.round);
  try{
    const response=await fetch('/api/pass/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side,round})});
    const data=await response.json();if(!response.ok)throw new Error(data.error);
    selected=data.id;cursor=0;logs.textContent='';
    statusEl.dataset.state='running';statusEl.textContent=`${side} 场地 · 回合 ${round} · 执行中`;
    localStorage.setItem('robocup-pass-run',selected);
    poll();
  }catch(error){statusEl.dataset.state='failed';statusEl.textContent=`启动失败：${error.message}`;}
});
selected=localStorage.getItem('robocup-pass-run');
if(selected)logs.textContent='';
// 服务重启后旧记录不存在，恢复到本次服务的最新执行记录。
async function restore(){if(selected){try{const r=await fetch('/api/pass/state?id='+encodeURIComponent(selected));if(r.status===404){selected=null;localStorage.removeItem('robocup-pass-run');}}catch(e){}}await poll();}
restore();setInterval(poll,500);
</script>
</body>
</html>
