# ⚠️ 本文件**不是** ROS 参数文件，而是给节点自己 yaml.safe_load 的配置文件，
#    因此顶层可以有自定义键。启动时必须通过 config_file 参数传入：
#        parameters=[{"config_file": "<此文件路径>"}]
#    不要写成 parameters=["<此文件路径>"]，那样 ROS 会当作 --params-file 解析而报错。
# RoboCup 篮球机器人 · 任务与场地配置
#
# ⚠️⚠️ 场地几何量（篮筐位置、传球区、边界线半径）必须按**当届场地示意图**填写！
#      规则文本只说"详见场地示意图"，没有给出坐标。这里给的是占位值，
#      目的是让状态机能跑起来，不是可以直接上场用的数字。

field:
  length_m: 14.0        # §2.4-1  1/4 标准篮球场长
  width_m: 7.5          # §2.4-1  宽

  # ══════════════════════════════════════════════════════════════════════
  # 坐标约定（本文件所有坐标都用它）
  #   x 沿 14m 长边；原点在**远离篮筐**那条底线，x=14 是"右侧底线"（篮筐端）
  #   y 沿 7.5m 短边；原点在一条边线，y=3.75 是宽度中线
  #   yaw=0 指向 +x（朝篮筐）
  # ══════════════════════════════════════════════════════════════════════
  #
  # 数值来源标注（三种，可信度递减）：
  #   【规则正文】= 规则文本直接写明，可直接用
  #   【推导】    = 由规则正文 + 标准篮球场尺寸推导，需场地图复核
  #   【待场地图】= 规则只写"详见场地示意图"，我们尚无 2026 图 → 仍是占位值
  #
  # ⚠️ 2026 规则正文**没有**给这些半径（第 179-180 行只说"详见场地示意图"）。
  #    所以下面【规则正文】的值取自 **2025 规则文本**（~/篮球规则/2025规则.txt）：
  #      · 第 366-367 行：投篮边界线 = 以篮筐圆心为圆心、半径 2 米半圆线；
  #        初赛"迷你篮筐与标准篮球场的篮筐投影同心圆放置"
  #      · 第 253-256 行：三分线 = 以右侧底线中点向场内 3 米点为圆心、半径
  #        3.75 米圆弧；传球边界线 = 长 5 米直线；三分线内置球区 = 平行
  #        右侧底线 5 米处
  #    2026 相对 2025 的改动（规则第 31-36、51 行：自带用球、取消三分线外取球
  #    限制、决赛篮筐可动）**均未提及改动场地标线**，故沿用。
  #    👉 拿到 2026 场地示意图后逐项复核。

  # 迷你篮筐【推导】初赛与标准篮筐投影同心；标准篮球场篮筐中心距底线 1.575m
  # （FIBA）→ x = 14 − 1.575 = 12.425。原占位值 13.5 相当于距底线 0.5m（在篮板
  # 后面），是错的。
  hoop: {x: 12.425, y: 3.75}

  # 投篮边界线半径【规则正文】2025 规则第 367 行。
  # 机器人必须在此圆**外**投篮才拿 10 分/次；圆内只拿 5 分/次。圆以**篮筐**为圆心。
  # （原占位值 3.0 是错的）
  shoot_line_radius_m: 2.0

  # 三分线【规则正文】2025 规则第 254-255 行。
  # 命中分档：三分线**外**投进 30 分，线**内**投进 10 分。
  # ⚠️ 圆心不是篮筐！"右侧底线中点向场内 3 米" → (14−3, 3.75)，与篮筐差 1.425m。
  #    所以单列 three_point_center，代码里 is_three_point() 用它而不是 hoop。
  # （原占位值 6.0 是错的）
  three_point_radius_m: 3.75
  three_point_center: {x: 11.0, y: 3.75}

  # 传球区（机器人必须在此区域内传球才拿 10 分/次，区外 5 分）【待场地图】
  # 已知：传球边界线是**长 5 米的直线**（2025 规则第 253 行），
  #       但它的位置与朝向只在场地示意图里 → 下面多边形仍是**占位值**。
  # ⚠️ 这块填错会让 _zone_ok() 误判"位置不合规"，从而拒绝传球。
  pass_zone:
    polygon:
      - [8.0, 1.0]
      - [13.0, 1.0]
      - [13.0, 6.5]
      - [8.0, 6.5]

  # ── 状态机导航用的"动作点" ──
  # shoot_zone_target【推导】：需同时满足"投篮线外"（距篮筐 > 2.0m）与
  #   "三分线内"（10 分档，距 (11,3.75) < 3.75m）。
  #   取 (9.5, 3.75)：距篮筐 2.925m（线外 0.93m）✅，距三分圆心 1.5m（线内）✅
  shoot_zone_target: {x: 9.5, y: 3.75}
  # 30 分档需在三分线外，例如 (7.0, 3.75)：距三分圆心 4.0m ✅，但距篮筐 5.425m。
  # 目前没有发射机构的**实测射程表**，不要贸然切过去。
  shoot_zone_target_30: {x: 7.0, y: 3.75}

  # pass_zone_target【待场地图】：占位值
  pass_zone_target: {x: 10.5, y: 3.75}

  # 出发区 A（机器人起始位）【待场地图】§2.4-3 只说设 A/B 区，位置在示意图里
  home: {x: 1.0, y: 1.0}

  # 认为"球已经到吸取距离"的门限
  grab_distance_m: 0.45

limits:
  max_linear: 0.40          # m/s，比赛先保守
  max_angular: 0.80         # rad/s
  kp_linear: 1.5
  kp_yaw: 2.0
  position_tolerance: 0.10  # m
  # 导航时是否"转向行进方向"（前进/回位/点地图 GOTO 三个阶段都生效）。
  # 全向底盘**不需要**：可以直接平移过去，朝向由对齐阶段单独管。
  # ⚠️ 开着的副作用：目标很近时行进方向被几厘米的定位噪声带偏
  #    → 车原地乱转 + 乱飘（实测症状："点车附近，车乱转乱飘"），故默认 false。
  face_travel: false
  # 点地图（RViz 2D Goal Pose）到位后是否转向对准目标朝向。默认 false：
  # "点一下 → 平移过去"，不转朝向。RViz 点一下默认朝向是 0°，
  # 开着会让车到位后转向 +x，很困惑。
  goto_align_yaw: false
  yaw_tolerance: 0.08       # rad (~4.6°)
  close_lost_distance_m: 0.9  # 球曾近于此距离后消失 → 视为已贴上（球会移出视野）
  seek_speed_ratio: 0.8       # 找球时的速度 = max_linear × 此比例（有距离估计时再按距离减速）

timeouts:
  start_delay_s: 8.0        # §2.3-7 规则要求 5~15s，且期间不得有任何动作
  state_timeout_s: 25.0     # 对准/吸取这类"原地"阶段的超时
  # 导航类阶段（找球/去动作区/回位）要跨越整个场地：
  #   到动作区最远约 10m，0.4m/s 就要 25s —— 用 25s 超时必然误触发（实测踩到过）。
  #   场地 14m 对角约 16m，0.4m/s ≈ 40s，留一倍余量到 90s。
  nav_timeout_s: 90.0
  mission_timeout_s: 300.0  # 一次任务总超时（规则每环节约 10 分钟）
  acquire_seconds: 2.5      # 没有持球传感器时，按时间假定吸取完成
  launch_hold_s: 1.5        # 一次动作持续多久

rules:
  actions_per_mission: 2    # §2.5 每环节累计 2 次动作
  max_ball_count: 2         # §2.5 违规：单次持球超过两颗
  require_zone_compliance: true   # 位置不合规就不动作（否则只拿低分）

# 各环节的"目标球 / 干扰球 / 瞄准物"角色。
# §2.5 明确两个环节的角色是**互换**的，这是最容易搞错的地方：
#   传球环节：目标球 = 篮球，干扰球 = 排球
#   投篮环节：目标球 = 排球，干扰球 = 篮球
mission_labels:
  PASS:
    ball: ball_basketball
    interference: ball_volleyball
    aim: rack_ring          # 传球目标区 3 = 传球架顶部圆环，50 分
  SHOOT:
    ball: ball_volleyball
    interference: ball_basketball
    aim: hoop

launcher:
  speed: 2800               # 沿用上一届 shoot_data.csv 的常见转速
  angle: 64
  use_fast_shoot: false

topics:
  cmd_vel: "/cmd_vel"
  pose: "/localization/pose"
  loc_ok: "/localization/ok"
  detections: "/perception/detections"
  launcher_ok: "/rb_launcher/ok"
  launch_service: "/rb_launcher/launch"
  estop: "/mission/estop"
  has_ball: "/mission/has_ball"

# 视觉势场避障：把干扰球 / 障碍物检测换算成"排斥速度"，叠加到前进速度上。
# 依据 §2.2 的"避障"技术要求，以及 §2.5 两个环节的干扰球角色。
# 只有带有效距离估计（单目测距已标定）的检测才会触发排斥；未标定时安全跳过。
avoidance:
  enabled: true            # 总开关
  range_m: 1.2             # 干扰球/障碍物进入此距离内才开始排斥（势场作用半径）
  repulsion_gain: 0.8      # 排斥增益，越大越"躲得猛"
  max_repel_vel: 0.30      # 排斥速度上限 m/s，避免急转
  min_confidence: 0.30     # 低于此置信度的检测不参与避障
  # 排斥目标集合：自主任务里只躲"干扰球 + obstacle"；手动 GOTO/IDLE 时躲所有球
  # ⚠️ 不要再放 ball_unknown：COCO 预训练的 YOLO 把【任何球】都输出成 ball_unknown，
  #    若参与避障，机器人会去躲**目标球**。等换成 2 类模型后再按需加。
  extra_labels: []

control:
  rate_hz: 20.0
