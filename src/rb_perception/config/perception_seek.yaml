# 基于Linux回退版的标定和模型，只启用球YOLO。
camera:
  fx: 794.16
  fy: 793.9
  cx: 577.4
  cy: 378.38
  assumed_hfov_deg: 60.0
  distortion:
  - 0.018392
  - -0.525673
  - 0.015934
  - 0.004543
  - 0.808854
perception:
  detectors:
  - label: ball_basketball
    type: blob
    enabled: false
    hsv_ranges:
    - - 173
      - 70
      - 0
      - 11
      - 255
      - 255
    min_area_ratio: 0.0006
    max_area_ratio: 0.2
    aspect_range:
    - 0.6
    - 1.7
    circularity_min: 0.55
    real_diameter_m: 0.24
  - label: ball_volleyball
    type: blob
    enabled: false
    hsv_ranges:
    - - 17
      - 10
      - 55
      - 31
      - 255
      - 255
    - - 104
      - 46
      - 0
      - 121
      - 255
      - 255
    min_area_ratio: 0.0006
    max_area_ratio: 0.2
    aspect_range:
    - 0.6
    - 1.7
    circularity_min: 0.5
    real_diameter_m: 0.21
  - label: hoop
    type: circle
    enabled: false
    hsv_ranges:
    - - 0
      - 120
      - 90
      - 12
      - 255
      - 255
    - - 170
      - 120
      - 90
      - 179
      - 255
      - 255
    dp: 1.2
    min_dist_ratio: 0.08
    param1: 120.0
    param2: 28.0
    min_radius_ratio: 0.02
    max_radius_ratio: 0.35
    real_diameter_m: 0.4
    require_hollow: true
    hollow_max_ratio: 0.75
  - label: rack_ring
    type: circle
    enabled: false
    hsv_ranges: []
    dp: 1.2
    min_dist_ratio: 0.08
    param1: 120.0
    param2: 30.0
    min_radius_ratio: 0.02
    max_radius_ratio: 0.35
    real_diameter_m: 0.55
    require_hollow: true
    hollow_max_ratio: 0.75
  - label: pillar
    type: stripe
    enabled: false
    hsv_ranges_a:
    - - 100
      - 80
      - 60
      - 130
      - 255
      - 255
    hsv_ranges_b:
    - - 40
      - 60
      - 60
      - 85
      - 255
      - 255
    min_total_area_ratio: 0.0008
    aspect_min: 1.2
    aspect_max: 12.0
    x_tolerance_ratio: 0.6
    real_width_m: 0.2
  - label: yolo
    type: onnx
    enabled: true
    model_path: /home/user/models/ball.onnx
    conf_threshold: 0.25
    cross_class_overlap: 0.55
    cross_class_labels:
    - ball_basketball
    - ball_volleyball
    iou_threshold: 0.45
    input_size: 640
    every_n_frames: 2
    intra_op_threads: 2
    inter_op_threads: 1
    real_diameter_m: 0.24
    class_real_size:
      ball_basketball: 0.24
      ball_volleyball: 0.21
    only_mapped: true
    name_map:
      篮球: ball_basketball
      排球: ball_volleyball
      basketball: ball_basketball
      volleyball: ball_volleyball
  lidar_ball:
    enabled: false
    mode: fuse
    cloud_topic: /cloud_registered
    odom_topic: /Odometry
    z_min: -1.35
    z_max: -0.75
    ball_radius_m: 0.12
    radius_tolerance_m: 0.07
    cluster_tolerance_m: 0.09
    min_points: 6
    max_range_m: 6.0
    match_distance_m: 0.7
