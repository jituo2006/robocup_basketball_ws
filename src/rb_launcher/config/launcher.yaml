# 弹射/运球/夹爪机构串口
#
# 协议移植自 ROBOCON 2025 的 ballrobot，**未改动帧格式**：
#   `+` | cmd(1B) | speed(2B 小端) | angle(2B 小端) | crc32(4B, 覆盖前 6 字节) | `*`
#   共 11 字节，115200 8N1
rb_launcher:
  ros__parameters:
    # ⚠️ 上一届用的是 /dev/R1_usb2ttl，但**本机 udev 规则只生成 /dev/usb2ttl**，
    #    名字对不上。现在节点会**自动回退**：这个 port 不存在时，按下面的
    #    fallback_ports 顺序找第一个真实存在的设备，并在日志里说明用了哪个。
    #    所以正常情况下不用改这里；要固定某个设备就补一条 udev 规则（见 docs/04）。
    port: "/dev/R1_usb2ttl"
    # port 不存在时的候选（相对 /dev 的名字或绝对路径都行）。
    fallback_ports:
      - "usb2ttl"
      - "ttyUSB0"
      - "ttyUSB1"
      - "ttyUSB2"
      - "ttyUSB3"
      - "ttyACM0"
      - "ttyACM1"
    baud: 115200

    send_rate_hz: 50.0      # 命令重复发送频率（下位机靠重复帧取最新值）
    default_speed: 2800     # 默认发射转速（来自上一届 shoot_data.csv 的常见值）
    default_angle: 64       # 默认角度（来自上一届数据的常数列）

    # 打开失败时是否自动重连
    auto_reconnect: true
    reconnect_period_s: 2.0
