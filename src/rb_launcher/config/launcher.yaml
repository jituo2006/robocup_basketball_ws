# 弹射/运球/夹爪机构串口
#
# 协议移植自 ROBOCON 2025 的 ballrobot，**未改动帧格式**：
#   `+` | cmd(1B) | speed(2B 小端) | angle(2B 小端) | crc32(4B, 覆盖前 6 字节) | `*`
#   共 11 字节，115200 8N1
rb_launcher:
  ros__parameters:
    # 按当前吸球机构转接器的名称/序列号固定；更换转接器时修改此参数。
    port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AR05Y7IF-if00-port0"
    # port 不存在时的候选（相对 /dev 的名字或绝对路径都行）。
    # ⚠️ 默认**不启用回退**（节点里的 C++ 默认值是空表），这是安全选择：
    #    像 "usb2ttl" 这种名字是通配的（本机 usb2ttl_1.rules 那条就没有端口/
    #    序列号限制），多个 CH34x 同时插着时会指向别的设备 —— 机构指令就发错地方。
    #    正常请用 udev 规则把设备固定成上面的 port（见 docs/04），不用回退。
    #    真要临时启用，就显式列出确定属于本机构的设备：
    #      fallback_ports: ["usb2ttl"]
    #
    # ⚠️⚠️ 千万不要写成 `fallback_ports: []` —— ROS 2 的 YAML 参数**不接受空序列**，
    #    会抛 InvalidParameterValueException("No parameter value set") 让节点直接崩。
    #    要"空"就不写这个键。
    baud: 115200

    send_rate_hz: 50.0      # 命令重复发送频率（下位机靠重复帧取最新值）
    default_speed: 2800     # 默认发射转速（来自上一届 shoot_data.csv 的常见值）
    default_angle: 64       # 默认角度（来自上一届数据的常数列）

    # 打开失败时是否自动重连
    auto_reconnect: true
    reconnect_period_s: 2.0

    # ── 文本指令（这台机构的真实协议）──────────────────────────────
    # ⚠️ STOP / ZERO / MOVE 1 90 5 这套【文本协议】，和本文件上面那套
    #    11 字节二进制帧是两回事 —— 这台机构只认文本。
    #    发送入口：服务 /rb_launcher/text（rb_msgs/srv/SerialText）。
    #    固件若要 \r\n，把这里改成 "\r\n"。
    line_ending: "\n"
