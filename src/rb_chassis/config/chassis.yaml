# RoboCup 篮球机器人 · 底盘参数
#
# ⚠️⚠️ 这些数值是从 ROBOCON 2025 篮球工程抄过来的：
#        setParameter(limit_vel=2.0, limit_acc=2.0, width=0.17, length=0.17,
#                     wheel_radius=0.1, ratio=100)
#      但 **ratio 在原实现里被设置后从未参与计算**，所以这里必须填 1.0
#      才能与原行为一致。等实测确认电机侧是否还有一级减速再改。
#
#      width / length / wheel_radius 必须用**实车卷尺量出来的值**替换！
#      width/length 是"轮子中心到轮子中心"的距离，不是车体外廓。
#      量错会导致转速整体偏，转向偏得尤其厉害。
rb_chassis:
  ros__parameters:
    can_interface: "can0"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    board_id: 1

    limit_vel: 1.0          # 速度上限 (m/s, rad/s)。比赛建议先设小值
    limit_acc: 1.5          # 加速度上限。原实现此项无效，这里已生效

    # 旋转方向符号。默认 +1（2026-09-19 实测纠正过：原来代码是 -1，自转方向反了）。
    # 若换轮子/改电机接线后自转方向又反了，改成 -1 即可，不用改代码重编译。
    angular_z_sign: 1.0

    # ↓↓↓ 2026-10-09 按 **CAD 实测**填入（实车卷尺复核一遍更稳）↓↓↓
    #
    # ⚠️ width/length 是【轮子中心到轮子中心】的距离，**不是车体外廓尺寸**。
    #
    # CAD 图（俯视图）给的是轮心正方形：
    #     dx = 469.28 mm, dz = 469.28 mm        ← 相邻轮心间距（正方形边长）
    #     对角 = 663.66 mm                       ← 469.28 × √2 ✓ 自洽
    #   所以轮心正方形边长 = 0.46928 m，中心到轮 = 663.66/2 = 0.33183 m
    #   校验: hypot(0.46928/2, 0.46928/2) = 0.33183 ✓ 与 CAD 对角一致
    #
    # ✅ 轮径：实车卷尺量得直径 15cm → wheel_radius = 0.075 m。
    #    （CAD 轮子图上那个"最小距离 143.74mm"测的是滚子处的最小间距，
    #      不是外径，别拿它当轮径。）
    #    仍建议用 straight 标定复核，轮子磨损会有几个百分点偏差：
    #     python3 tools/measure_chassis.py straight --speed 0.15 --seconds 6
    #     python3 tools/measure_chassis.py rotate   --angular 0.5 --seconds 6
    width: 0.4693           # CAD: 轮心正方形边长 469.28mm（原 0.44 是占位）
    length: 0.4693          # CAD: 同上（X 布局，两个方向等距）
    wheel_radius: 0.075     # 实车实测：轮径 15cm → 半径 0.075 m
    ratio: 1.0              # 必须为 1.0（见文件头说明）

    # /cmd_vel 的坐标系。**必须保持 body**（ROS 标准：/cmd_vel 就是车体系速度）。
    # 任务侧 rb_mission.goto_command 输出的已经是车体系（它内部做了 R(−yaw)）。
    # 若改成 world，底盘会再按里程计 yaw 转一次 = **双重旋转**，方向全错
    # （实测症状：车朝左时想往前走却倒退；yaw=0 时恰好看不出问题）。
    # 只有外部发布者确实发场地系速度时才该改成 world。
    cmd_vel_frame: body

    cmd_vel_timeout_ms: 200 # 收不到 /cmd_vel 就发零速（安全网，不要调大）
    control_period_ms: 10   # 100 Hz
    dry_run: false          # true = 只解算不下发 CAN
