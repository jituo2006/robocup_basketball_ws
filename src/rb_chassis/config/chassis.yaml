# RoboCup 篮球机器人 · 底盘参数
#
# ⚠️⚠️ 这些数值是从 ROBOCON 2025 篮球工程抄过来的：
#        setParameter(limit_vel=2.0, limit_acc=2.0, width=0.17, length=0.17,
#                     wheel_radius=0.1, ratio=100)
#      但 **ratio 在原实现里被设置后从未参与计算**，所以这里必须填 1.0
#      才能与原行为一致。等实测确认电机侧是否还有一级减速再改。
#
#      几何尺寸已于 2026-10-09 从用户提供的 CAD 核对，见 docs/09_底盘CAD尺寸核查.md。
#      width/length 是轮心间距，不是车体外廓；wheel_radius 是半径，不是直径。
#      CAD 给出设计初值，实车仍需标定有效滚动半径及转向精度。
rb_chassis:
  ros__parameters:
    can_interface: "can0"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"
    board_id: 1

    limit_vel: 1.0          # 速度上限 (m/s, rad/s)。比赛建议先设小值
    limit_acc: 1.5          # 加速度上限。原实现此项无效，这里已生效

    # 旋转方向符号。默认 +1（2026-09-19 实测纠正过：原来代码是 -1，自转方向反了）。
    # 若换轮子/改电机接线后自转方向又反了，改成 -1 即可，不用改代码重编译。
    angular_z_sign: 1.0

    # 2026-10-09 CAD 核查：篮球车-底座.SLDASM + R2_OTOW-全向轮装配.STEP。
    # 轮心由两排滚子中心的轴向中面确定，不能直接用装配原点或截图选点。
    # CAD X/Z 两方向轮心间距均为 477.059538 mm；旋转力臂为 337.332034 mm。
    # STEP 外径为 153 mm；143.74 mm 的截图最小距离不是轮径。
    # 设计尺寸不代表实车标定完成：先低速平移，再原地旋转复核。
    #     python3 tools/measure_chassis.py straight --speed 0.15 --seconds 6
    #     python3 tools/measure_chassis.py rotate   --angular 0.5 --seconds 6
    width: 0.477059538      # m，轮心间距
    length: 0.477059538     # m，轮心间距
    wheel_radius: 0.0765   # m，外径 153 mm / 2；有效滚动半径待实车标定
    ratio: 1.0              # 必须为 1.0（见文件头说明）

    cmd_vel_timeout_ms: 200 # 收不到 /cmd_vel 就发零速（安全网，不要调大）
    control_period_ms: 10   # 100 Hz
    dry_run: false          # true = 只解算不下发 CAN
