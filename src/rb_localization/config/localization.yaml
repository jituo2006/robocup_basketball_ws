# ⚠️ 本文件**不是** ROS 参数文件，而是给节点自己 yaml.safe_load 的配置文件，
#    因此顶层可以有自定义键。启动时必须通过 config_file 参数传入：
#        parameters=[{"config_file": "<此文件路径>"}]
#    不要写成 parameters=["<此文件路径>"]，那样 ROS 会当作 --params-file 解析而报错。
#
# ─────────────────────────────────────────────────────────────────────
# 定位方案：雷达（FAST-LIO）+ 视觉（定位柱）
#
# 为什么不用全场定位板：RoboCup 规则 §2.4 的场地器材清单里没有"全场定位系统"，
#   用队里自架的外部定位有合规风险。雷达 + 规则提供的定位柱是完全车载、合规的方案。
#
# 场地：1/4 标准篮球场 长 14m × 宽 7.5m
# 场地坐标系：原点建议放在某个出发区角点，x 沿 14m 方向，y 沿 7.5m 方向
# ─────────────────────────────────────────────────────────────────────

# ── 雷达里程计 → 场地坐标系 的标定（核心）──────────────────────────────
#
# FAST-LIO 发布的是它**自己初始化时刻**建立的坐标系(camera_init)下的位姿，
# 与场地坐标系原点、朝向都不同，必须先做刚体变换。
#
# 你只需要告诉节点两件事：
#   ① start_pose —— 开机时车被摆在场地里的哪个位置（人工摆正 + 卷尺量）
#   ② sensor_to_base_* —— 雷达相对车体参考点的安装偏移
# 旋转量由 "start_pose.yaw − 首帧yaw" 自动算出，**不需要手填 -90° 之类的轴偏**。
odom_frame_conversion:
  enabled: true
  zero_on_first: true          # 用开机后第一帧里程计作为 odom 原点（推荐）

  # 开机时车在场地里的位置（**必须人工摆正并实测**）
  # 例：把车推到出发区 A 的中心，车头朝场地 +x 方向
  start_pose:
    x: 1.0
    y: 1.0
    yaw: 0.0

  # 雷达安装偏移：base = sensor + R(**车体yaw**) · (sensor_to_base)
  #
  # ⚠️ 填的是「**从雷指向车体旋转中心**」的向量，**方向是反的**：
  #     雷达在中心【前方 30cm】 ⇒ 从雷达指向中心 = 向【后】30cm ⇒ 填 **−0.30**
  #
  #   ⚠️⚠️ 曾经填 +0.3，且用【雷达自己的 yaw】旋转。本车雷达装了 −85°，
  #         等于把"前 30cm"转成了"侧 30cm" ——
  #         症状：RViz 里位姿箭头跑到车体的左上角。
  #         现已改为按车体 yaw 旋转（见 odom_to_field）。
  #
  #   若 start_pose 指的就是雷达位置（不是车体中心），这两项保持 0 即可。
  #
  # 本车实测：雷达在车体旋转中心【正前方 30cm、左右 0cm】
  sensor_to_base_x: -0.30
  sensor_to_base_y: 0.0
  # ⚠️ 雷达的【安装朝向】必须在这里告诉节点。
  #
  # 上面写"旋转量由 start_pose.yaw − 首帧yaw 自动算出" —— 那只解决
  # **开机时车没摆正**。FAST-LIO 的坐标系在初始化瞬间建立，首帧 yaw 恒为 0，
  # 所以自动算出的旋转里**不包含雷达装歪的角度**，必须在这里显式补偿。
  #
  # 标定法：把车沿车头方向直线推 1m，看 /Odometry 的位移方向。
  #   本车实测：车体后方(车体系 180°) 在雷达系里是 +94.7°
  #             → 雷达相对车体转了约 +85° → 填 -85
  #   （符号按代码约定 theta = start_pose.yaw − 首帧yaw − s2b_yaw 反推并验证过）
  sensor_to_base_yaw_deg: -85.0

  # FAST-LIO 的点云/地图所在坐标系名。
  # 节点会额外发一条 `field → camera_init` 的 TF —— 没有它，RViz 的 Fixed Frame
  # 是 field 时点云**完全画不出来（地图一片黑）**：FAST-LIO 只发
  # `camera_init → body`，两棵树不连通。
  # 换了里程计来源（如全场定位板）时，这里的坐标系名要一起改。
  odom_frame: "camera_init"

sources:
  # 雷达 FAST-LIO 的输出。既提供 twist（做预测）也提供 pose（做绝对观测）
  odom_topic: "/Odometry"
  use_odom_pose_as_abs: true

  # 可选：另一路独立的绝对位姿。雷达方案下留空。
  abs_pose_topic: ""

  detections_topic: "/perception/detections"

  # 相机光轴相对车体前进方向的偏置（**单位是弧度**）。相机装歪了就填这里。
  # ⚠️ 曾误填 30.0 —— 那是 30 **弧度** = 4.77 圈 = 279°，不是 30°。
  #    如果相机确实偏了 30°，应该填 0.5236（= 30 × π/180）。
  #    若相机光轴与车头平行，填 0.0。
  #    标法：把车正对一个已知方位的目标，看 /perception/detections 里它的
  #          bearing_rad，差多少就填多少（弧度）。
  camera_yaw_offset_rad: 0.0

output:
  pose_topic: "/localization/pose"
  ok_topic: "/localization/ok"
  publish_tf: true
  field_frame: "field"
  base_frame: "base_link"
  ok_std_threshold_m: 0.60
  publish_rate_hz: 20.0

initial_pose:
  x: 1.0
  y: 1.0
  yaw: 0.0

ekf:
  # 雷达里程计的噪声特性与轮式里程计不同：位置短期很准，长期会漂。
  # 下面的值是保守起点，实测后再调（见 docs/05_定位模块.md §3）。
  sigma_v: 0.06
  sigma_w: 0.05
  obs_std_xy: 0.10       # 雷达位姿观测噪声（比定位板小，因为它是车载自测）
  obs_std_yaw: 0.06
  bearing_std: 0.05      # 定位柱方位角观测噪声
  bearing_min_dist: 0.5  # 太近的定位柱方位角不可靠
  bearing_max_dist: 9.0

# 定位柱的实际摆放位置（场地坐标，单位 m）。
# 规则：定位柱放在"传球目标位/投篮目标位"，直径 20cm、高 1m、蓝绿相间。
# ⚠️ 每轮抽签后位置可能变 —— **比赛当天必须按实际摆放填入**。
landmarks: []
# 例如：
# landmarks:
#   - {x: 10.5, y: 3.75}     # 传球目标位的定位柱
#   - {x: 9.5,  y: 3.75}     # 投篮目标位的定位柱
