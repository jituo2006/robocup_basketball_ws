# ⚠️ 本文件**不是** ROS 参数文件，而是给节点自己 yaml.safe_load 的配置文件，
#    因此顶层可以有自定义键。启动时必须通过 config_file 参数传入：
#        parameters=[{"config_file": "<此文件路径>"}]
# RoboCup 篮球机器人 · 相机配置
#
# 本机实测（HD USB Camera, 05a3:9230, UVC 免驱）：
#   MJPG 1280x720 → 实测 27 fps；MJPG 640x480 → 45 fps
#   YUYV 1280x720 → 只有 9 fps（所以必须用 MJPG）
#
# ⚠️ 必须用 MJPG：FOURCC 要在设置分辨率之前下发（节点代码里已处理）。
#    如果用 YUYV，高分辨率下帧率会掉到 6~9fps。

camera:
  # Stable front-camera capture node; do not fall back to a numbered rear camera.
  # The ROS device parameter can override this when replacing hardware.
  device: "/dev/v4l/by-id/usb-HD_Camera_Manufacturer_USB_2.0_Camera-video-index0"
  width: 1280               # 识别远处球用 1280x720；CPU 吃紧或要更低延迟可改 640x480
  height: 720
  fps: 30.0                 # 相机请求帧率（实际由相机能力决定）
  fourcc: "MJPG"            # MJPG / YUYV，强烈建议 MJPG
  buffersize: 1             # 驱动缓冲压到 1 → 延迟最小
  flip: 0                   # 0=不翻转, 1=左右镜像, 2=上下翻转, -1=旋转180°
  publish_rate_hz: 0.0      # 0 = 不限速（有多少发多少）；设 15 则只发 15Hz
  reconnect_interval_s: 2.0 # 打不开/掉线后的重试间隔
  max_read_failures: 15     # 连续读失败多少次就重开相机
  # QoS 可靠性：
  #   reliable    （默认）兼容一切订阅者（含 rqt_image_view/RViz 的默认 QoS）
  #   best_effort 极限低延迟，但默认 QoS 的调试工具会收不到，需手动选 best_effort
  # 同机通信无丢包 + depth=1，reliable 也不会堆积延迟，所以默认选兼容性最好的 reliable。
  qos_reliability: "reliable"
  qos_depth: 1

  # 压缩图（JPEG）。⚠️ 强烈建议保持开启，这是本机实测的关键：
  #   原始 640x480 (921KB) 的图像消息，订阅端只能收到 ~7fps（即使 best_effort
  #   + ROS_LOCALHOST_ONLY=1）；而 320x240 (230KB) 就能跑满 30fps。
  #   说明"大图像消息的投递吞吐"约 7MB/s 是硬瓶颈，与分辨率无关、只看字节数。
  #   JPEG 把 640x480 压到 ~40KB，30fps 才 1.2MB/s，轻松跑满帧率。
  #   配套：rb_perception 要用 -p use_compressed:=true 订阅 /camera/image_raw/compressed
  publish_compressed: true
  # ⚠️ 是否发布【原始未压缩图】。默认 false ——
  #    1280x720 原始图 2.7MB/帧，30Hz ≈ 80MB/s；Python 有 GIL，这个发布线程
  #    会和采集线程抢锁，实测把采集从 50fps 拖到 5.8fps（同时"发布30 采集11"
  #    在重复发同一帧）。感知只用压缩话题，原始图没人用。
  #    要用 RViz 看原图 / 跑颜色标定时再打开。
  publish_raw: false
  jpeg_quality: 80

# 相机固定项：锁定自动曝光/白平衡。
#
# 为什么必须锁：HSV 颜色阈值对光照敏感，而相机的**自动曝光/自动白平衡一直在动**，
# 会让同一颗球在不同时刻落到不同的 S/V —— 上午标好的阈值下午就不好使。
# 锁死之后图像稳定，颜色标定一次就能长期有效。
#
# ⚠️ 本机实测（这台 HD USB Camera）：自动模式下 exposure_time_absolute 和
#    white_balance_temperature 都带 flags=inactive，**读不到相机自动算出的值**，
#    所以曝光/色温只能由这里指定。现场调法：
#        python3 tools/tune_camera.py        # 实时看画面 + 拖滑块，按 s 写回本文件
controls:
  enabled: true
  lock_exposure: true
  # ⚠️ 2026-10-09 实测：曝光 30 时画面几乎全黑（亮度均值 10.8/255），
  #    YOLO **完全检不出球**（检出 0 个）；调到 150 以上立刻出 2 个检测
  #    （ball_basketball 0.93 / ball_volleyball 0.88）。
  #    → 曝光是「能不能看到球」的开关，现场务必用 tune_camera.py 复核。
  # ⚠️ 固定曝光在早/中/晚、开灯/不开灯之间差好几倍，必然一会儿过曝一会儿过暗。
  #    实测 2026-10-11 白天：exposure=600 → 96.9% 像素过曝整片死白（YOLO 检不出球）；
  #    当天合适值是 100~200。600 是 10-09 晚上调的。
  #    → 打开下面的 auto_exposure，不要再手调这个值。
  exposure: 150             # 自动曝光的【起始值】；auto_exposure.enabled=false 时才是固定值
  # 软件自动曝光闭环：按目标亮度自己调曝光。
  # 不用相机自带自动曝光的原因：本机实测自动模式下 exposure_time_absolute
  # 带 flags=inactive，**读不到相机自己算的值**，颜色/距离标定会跟着漂。
  auto_exposure:
    enabled: true
    target_brightness: 115    # 目标灰度均值(0..255)。80~140 都合理，115 偏中间
    deadband: 14              # 亮度差在此范围内就不动。要大于频闪残余波动，
                              # 否则会一直追噪声（实测 8 时会在目标附近来回动）。
    gain: 0.5                 # 乘性指数：new = cur*(target/mean)^gain。
                              # 实测相机曝光→亮度是陡峭非线性的，线性步进会震荡收敛不了。
                              # 0.7 偏保守；若收敛太慢可加到 1.0（会更容易震荡）。
    tune_every_n: 15          # 每多少帧调一次（30fps 下 ≈ 0.5s）
    settle_frames: 5          # ⚠️ 调完曝光后跳过几帧再读亮度。
                              # 曝光改动要几帧后才体现在图像里，立刻读等于读旧曝光的结果，
                              # 闭环会追幻影、在目标两侧来回震荡（现场实测就是这个现象）。
    avg_frames: 8             # ⚠️ 必须跨过多个【光周期】再平均。
                              # 50Hz 人工光下，9.5ms 曝光短于 10ms 半周期，每帧采到光的
                              # 不同相位 → 实测同一曝光下亮度在 72↔144 之间摆。
                              # 8 帧 ≈ 0.27s ≈ 13 个光周期，平均后才是有意义的亮度。
    min: 30                   # 曝光下限，别调到全黑
    max: 3000                 # 曝光上限，别调到拖慢帧率
  lock_white_balance: true
  white_balance_temperature: 4600   # 2800..6500 K，4600 是这台相机的默认值
  power_line_frequency: 1   # 1 = 50Hz（国内，抗灯光闪频）；0=禁用 2=60Hz
  # 以下留空(null) = 不动相机原值；想固定就填数字
  gain: null
  brightness: null
  contrast: null
  saturation: null
  sharpness: null

output:
  image_topic: "/camera/image_raw"
  compressed_topic: "/camera/image_raw/compressed"
  camera_info_topic: "/camera/camera_info"
  frame_id: "camera_link"   # 与车体坐标系的关系，后续接 TF 时再细化

# 相机内参。用 tools/calibrate_camera.py 标定后会写回这里。
# 全为 0 时节点按 assumed_hfov_deg 估一个（能跑，但单目测距不准）。
# ⚠️ rb_perception 测距读的是它自己 perception.yaml 里的 camera 段，
#    所以标定脚本会把内参**同时**写进本文件和 perception.yaml。
intrinsics:
  fx: 794.16
  fy: 793.9
  cx: 577.4
  cy: 378.38
  assumed_hfov_deg: 60.0
  distortion: [0.018392, -0.525673, 0.015934, 0.004543, 0.808854]
